- aid: venice-ai:venice-ai-x402-api
  name: Venice.ai X402 API
  description: >-
    Wallet-based API access using the x402 protocol. No API key required — authenticate with an EVM or
    Solana wallet.


    **How it works:**

    1. **Authenticate** — Send a `SIGN-IN-WITH-X` header (base64-encoded signed SIWX payload) with any
    request. EVM wallets sign an EIP-4361 SIWE message; Solana wallets sign the Solana SIWX message with
    Ed25519. See the `siwx` security scheme for the exact format.

    2. **Top up** — `POST /x402/top-up` without a payment header returns an `accepts` array with Base
    and Solana USDC payment options. Choose one entry, sign it using the x402 SDK (`npm install x402`),
    and re-submit with the `PAYMENT-SIGNATURE` header (the legacy `X-402-Payment` and `X-PAYMENT` names
    are also accepted).

    3. **Use any endpoint** — All inference endpoints (chat, image, audio, video, embeddings) accept `siwx`
    as an alternative to `BearerAuth`. Charges are deducted from your USDC credit balance.

    4. **Monitor balance** — `GET /x402/balance/{walletAddress}` returns your current balance. The `X-Balance-Remaining`
    response header on inference calls also reports it.


    **Quick start (5 lines):**

    ```

    import { VeniceClient } from '@venice-ai/x402-client'

    const venice = new VeniceClient(process.env.WALLET_KEY)

    await venice.topUp(10) // $10 USDC on a supported x402 rail

    const res = await venice.chat({ model: 'zai-org-glm-5-1', messages: [{ role: 'user', content: 'Hello!'
    }] })

    ```


    **Payment:** USDC on Base (chain ID 8453) or Solana mainnet. Minimum top-up: $5. Alternatively, stake
    DIEM tokens for daily credits (1 DIEM = $1/day).
  humanURL: https://docs.venice.ai/api-reference/api-spec
  baseURL: https://api.venice.ai/api/v1
  tags:
  - x402
  properties:
  - type: OpenAPI
    url: openapi/venice-ai-x402-api-openapi.yml
  - type: Documentation
    url: https://docs.venice.ai/overview/about-venice
  - type: JSONSchema
    url: json-schema/venice-ai-model-response-schema.json
  - type: JSONSchema
