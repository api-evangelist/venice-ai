openapi: 3.2.0
info:
  title: Venice Ai Responses API
  version: '20261012.214344'
  termsOfService: https://venice.ai/legal/tos
  x-guidance: 'Venice.ai is an OpenAI-compatible inference API supporting text, image, audio, and video generation.


    **Authentication options:**

    - API Key: Use Bearer token in Authorization header

    - x402 Wallet: Use USDC credits via EVM or Solana wallet (no account required)


    **For x402 wallet access:**

    1. POST /x402/top-up without headers to get payment requirements

    2. Choose one of the returned Base or Solana payment options and sign a USDC payment using the x402 SDK

    3. POST /x402/top-up with PAYMENT-SIGNATURE header to add credits

    4. Call any inference endpoint with SIGN-IN-WITH-X header


    **Pricing:** Prepaid credits consumed per request. Check /models for available models and their capabilities.'
  description: 'Operations tagged Responses across 2 of this provider''s published API definitions: venice-ai-swagger.yaml, venice-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.venice.ai/api/v1
security:
- BearerAuth: []
tags:
- name: Responses
paths:
  /responses:
    post:
      description: '**Beta**: This endpoint is currently in beta and may be unstable. Request/response schemas and behavior may change without notice. It is available to all API users.


        Create a model response in OpenAI''s Responses API format. Works with every Venice text model and returns typed output items such as `reasoning`, `message`, and `function_call`. Set `stream: true` to receive Server-Sent Events.


        Most OpenAI models are forwarded to OpenAI''s Responses API natively. Other models, and requests that use Venice features such as web search or characters, are translated through Chat Completions, where some Responses features are not supported. Send `x-venice-responses-mode: native` or `compat` to choose the mode, and read the `x-venice-responses-lane` response header to see which one served the request.


        Venice does not store responses, so send the full conversation in `input` on every request. E2EE-capable models are not supported on this endpoint; use `/api/v1/chat/completions` with the required E2EE headers instead.


        See the Responses API guide for the features and limitations of each mode.


        **Authentication:** This endpoint accepts either a Bearer API key or a `SIGN-IN-WITH-X` header for x402 wallet-based authentication. The legacy `X-Sign-In-With-X` header is also accepted during migration. When using x402, a `402 Payment Required` response indicates insufficient balance and includes top-up instructions.'
      operationId: createResponse
      security:
      - BearerAuth: []
      - siwx: []
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: '0.001'
          max: '10.00'
        protocols:
        - x402: {}
      summary: /api/v1/responses
      tags:
      - Responses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
      responses:
        '200':
          description: Successful response
          headers:
            X-Balance-Remaining:
              description: Remaining x402 credit balance in USD after this request (only present for x402 auth).
              required: false
              schema:
                type: string
                example: '4.230000'
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier for the response.
                    example: resp_abc123
                  object:
                    type: string
                    enum:
                    - response
                    description: The object type.
                  created_at:
                    type: integer
                    description: Unix timestamp of when the response was created.
                  model:
                    type: string
                    description: The model used for the response.
                  status:
                    type: string
                    enum:
                    - completed
                    - failed
                    - in_progress
                    - cancelled
                    - incomplete
                    description: The status of the response.
                  incomplete_details:
                    type: object
                    properties:
                      reason:
                        type: string
                        enum:
                        - max_output_tokens
                        - content_filter
                    required:
                    - reason
                    description: Why generation ended before completion; partial output and usage are retained.
                  output:
                    type: array
                    items:
                      anyOf:
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - reasoning
                          id:
                            type: string
                          summary:
                            type: array
                            items:
                              type: string
                          encrypted_content:
                            type: string
                        required:
                        - type
                        - id
                        title: Reasoning Output
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - message
                          id:
                            type: string
                          status:
                            type: string
                            enum:
                            - completed
                            - in_progress
                            - failed
                            - incomplete
                          role:
                            type: string
                            enum:
                            - assistant
                          content:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - output_text
                                text:
                                  type: string
                                annotations:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      type:
                                        type: string
                                        enum:
                                        - url_citation
                                      url:
                                        type: string
                                      title:
                                        type: string
                                      start_index:
                                        type: integer
                                      end_index:
                                        type: integer
                                    required:
                                    - type
                                    - url
                                    - start_index
                                    - end_index
                                    title: URL Citation Annotation
                              required:
                              - type
                              - text
                              title: Output Text
                        required:
                        - type
                        - id
                        - status
                        - role
                        - content
                        title: Message Output
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - function_call
                          id:
                            type: string
                          call_id:
                            type: string
                          name:
                            type: string
                          namespace:
