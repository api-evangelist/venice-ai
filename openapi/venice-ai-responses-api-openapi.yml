                        - name
                        - input
                        - status
                      - type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - tool_search_call
                          id:
                            type: string
                          call_id:
                            type: string
                            minLength: 1
                          execution:
                            type: string
                            enum:
                            - client
                          arguments:
                            type: object
                            additionalProperties: {}
                          status:
                            type: string
                            enum:
                            - completed
                            - in_progress
                            - incomplete
                        required:
