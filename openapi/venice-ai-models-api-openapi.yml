openapi: 3.2.0
info:
  title: Venice Ai Models API
  version: '20261012.214344'
  termsOfService: https://venice.ai/legal/tos
  x-guidance: 'Venice.ai is an OpenAI-compatible inference API supporting text, image, audio, and video generation.


    **Authentication options:**

    - API Key: Use Bearer token in Authorization header

    - x402 Wallet: Use USDC credits via EVM or Solana wallet (no account required)


    **For x402 wallet access:**

    1. POST /x402/top-up without headers to get payment requirements

    2. Choose one of the returned Base or Solana payment options and sign a USDC payment using the x402 SDK

    3. POST /x402/top-up with PAYMENT-SIGNATURE header to add credits

    4. Call any inference endpoint with SIGN-IN-WITH-X header


    **Pricing:** Prepaid credits consumed per request. Check /models for available models and their capabilities.'
  description: 'Operations tagged Models across 2 of this provider''s published API definitions: venice-ai-swagger.yaml, venice-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.venice.ai/api/v1
security:
- BearerAuth: []
tags:
- description: List and describe the various models available in the API.
  name: Models
paths:
  /models:
    get:
      description: Returns a list of available models supported by the Venice.ai API across text, image, audio, video, and related inference types.
      operationId: listModels
      security:
      - {}
      - BearerAuth: []
      summary: /api/v1/models
      tags:
      - Models
      parameters:
      - schema:
          anyOf:
          - type: string
            enum:
            - asr
            - decision
            - embedding
            - image
            - music
            - text
            - tts
            - upscale
            - inpaint
            - video
          - type: string
            enum:
            - all
            - code
          description: Filter models by type. Use "all" to get all model types.
          example: text
        required: false
        name: type
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelResponse'
                    description: List of available models
                  object:
                    type: string
                    enum:
                    - list
                  type:
                    anyOf:
                    - type: string
                      enum:
                      - asr
                      - decision
                      - embedding
                      - image
                      - music
                      - text
                      - tts
                      - upscale
                      - inpaint
                      - video
                    - type: string
                      enum:
                      - all
                      - code
                    description: Type of models returned.
                    example: text
                required:
                - data
                - object
                - type
        '403':
          $ref: '#/components/responses/ApiKeyIpRestrictedError'
        '500':
          description: An unknown error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
  /models/traits:
    get:
      description: Returns a list of model traits and the associated model.
      operationId: listModelTraits
      security:
      - {}
      - BearerAuth: []
      summary: /api/v1/models/traits
      tags:
      - Models
      parameters:
      - schema:
          type: string
          enum:
          - asr
          - decision
          - embedding
          - image
          - music
          - text
          - tts
          - upscale
          - inpaint
          - video
          default: text
          description: Filter models by type.
          example: text
        required: false
        name: type
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ModelTraitSchema'
                  object:
                    type: string
                    enum:
                    - list
                  type:
                    anyOf:
                    - type: string
                      enum:
                      - asr
                      - decision
                      - embedding
                      - image
                      - music
                      - text
                      - tts
                      - upscale
                      - inpaint
                      - video
                    - type: string
                      enum:
                      - all
                      - code
                    description: Type of models returned.
                    example: text
                required:
                - data
                - object
                - type
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          $ref: '#/components/responses/ApiKeyIpRestrictedError'
        '500':
          description: An unknown error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
  /models/compatibility_mapping:
    get:
      description: Returns a list of model compatibility mappings and the associated model.
      operationId: listModelCompatibilityMapping
      security:
      - {}
      - BearerAuth: []
      summary: /api/v1/models/compatibility_mapping
      tags:
      - Models
      parameters:
      - schema:
          type: string
          enum:
          - asr
          - decision
          - embedding
          - image
          - music
          - text
          - tts
          - upscale
          - inpaint
          - video
          default: text
          description: Filter models by type.
          example: text
        required: false
        name: type
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ModelCompatibilitySchema'
                  object:
                    type: string
                    enum:
                    - list
                  type:
                    anyOf:
                    - type: string
                      enum:
                      - asr
                      - decision
                      - embedding
                      - image
                      - music
                      - text
                      - tts
                      - upscale
                      - inpaint
                      - video
                    - type: string
                      enum:
                      - all
                      - code
                    description: Type of models returned.
                    example: text
                required:
                - data
                - object
                - type
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          $ref: '#/components/responses/ApiKeyIpRestrictedError'
        '500':
          description: An unknown error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
components:
  schemas:
    ModelCompatibilitySchema:
      type: object
      additionalProperties:
        type: string
      description: List of available models
      example:
        gpt-4o: zai-org-glm-5-1
    ModelResponse:
      type: object
      properties:
        context_length:
          type: number
          description: The context length (maximum input tokens) supported by the model. Only present for text models. This is a standard OpenAI-compatible field that mirrors model_spec.availableContextTokens for client compatibility.
          example: 131072
        created:
          type: number
          description: Release date on Venice API
          example: 1699000000
        discount_to_user:
          type: number
          description: 'Fractional discount carried by a reseller agreement covering this model, e.g. 0.2 for 20% off, following the OpenRouter convention of publishing a base price alongside a separate discount fraction: user price = base price × (1 - discount_to_user). Returned only to the reselling partner whose agreement it belongs to, and omitted for every other caller and for models no agreement covers, so an integration should treat an absent field as no discount. Always greater than 0 and less than 1. Prices in model_spec.pricing are what Venice bills and already reflect any promotional discount active for the caller, so apply discount_to_user to those published prices rather than to a separate list rate. Callers buying from Venice directly rather than through a reseller should ignore this field.'
          example: 0.2
          exclusiveMinimum: 0
          exclusiveMaximum: 1
        id:
          type: string
          description: Model ID
          example: gemini-3-6-flash
        model_spec:
          type: object
          properties:
            availableContextTokens:
              type: number
              description: The context length supported by the model. Only applicable for text models.
              example: 1000000
            maxCompletionTokens:
              type: number
              description: The maximum number of completion tokens the model can generate. Use this to know the upper bound for the max_completion_tokens request parameter. Only applicable for text models.
              example: 65536
            beta:
              type: boolean
              description: Is this model restricted to beta users only? If true, only users with beta access can use this model
              example: false
            betaModel:
              type: boolean
              description: Is this model in beta status?
              example: false
            privacy:
              type: string
              enum:
              - private
              - anonymized
              description: The privacy mode of the model. Private models have zero data retention. Anonymized models Venice can not guarantee privacy on, but requests are not affiliated with a user
              example: private
            regionRestrictions:
              type: array
              items:
                type: string
              description: Country codes where this model is intended to be available. Only present for models with region restrictions metadata.
              example:
              - US
            deprecation:
              type: object
              properties:
                autoRemap:
                  type: boolean
                  description: When true, Venice may automatically remap API requests for this model ID to replacementModelId instead of returning an error.
                  example: false
                date:
                  type: string
                  description: Legacy ISO 8601 instant aligned with the deprecation sunset used in response headers (`x-venice-model-deprecation-date`). Prefer startsAt / removesAt for new integrations.
                  example: 2025-03-01 00:00:00+00:00
                removesAt:
                  type: string
                  description: ISO 8601 instant when this model ID is omitted from public GET /models listings (same value as `date` today). Consumers should treat the current wall-clock time as past this instant when deciding whether the model remains listed.
                  example: 2025-04-01 00:00:00+00:00
                replacementModelId:
                  type: string
                  description: Suggested public API model ID to migrate to, when one exists.
                  example: llama-3-3-70b
                startsAt:
                  type: string
                  description: ISO 8601 instant when deprecation warnings and documentation should be considered active for this model.
                  example: 2025-03-01 00:00:00+00:00
              required:
              - autoRemap
              - date
              - removesAt
              description: Deprecation information for the model. Only present for models scheduled to be retired
              example:
                autoRemap: false
                date: 2025-03-01 00:00:00+00:00
                removesAt: 2025-03-01 00:00:00+00:00
            capabilities:
              type: object
              properties:
                optimizedForCode:
                  type: boolean
                  description: Is the LLM optimized for coding?
                  example: true
                quantization:
                  type: string
                  enum:
                  - fp4
                  - fp8
                  - fp16
                  - bf16
                  - int8
                  - int4
                  - not-available
                  description: The quantization type of the running model.
                  example: fp8
                supportsFunctionCalling:
                  type: boolean
                  description: Does the LLM model support function calling?
                  example: true
                supportsAudioInput:
                  type: boolean
                  description: Does the LLM support audio input?
                  example: false
                supportsReasoning:
                  type: boolean
                  description: Does the model support reasoning with <thinking> blocks of output.
                  example: true
                supportsReasoningEffort:
                  type: boolean
                  description: Does the model support the reasoning_effort parameter to control reasoning depth.
                  example: true
                reasoningEffortOptions:
                  type: array
                  items:
                    type: string
                    enum:
                    - none
                    - minimal
                    - low
                    - medium
                    - high
                    - xhigh
                    - max
                  description: Supported reasoning_effort values for this model. Only present when supportsReasoningEffort is true. The "none" option means reasoning can be disabled.
                  example:
                  - none
                  - low
                  - medium
                  - high
                defaultReasoningEffort:
                  type: string
                  enum:
                  - none
                  - minimal
                  - low
                  - medium
                  - high
                  - xhigh
                  - max
                  description: Default reasoning_effort value used when the request does not specify one. Only present when supportsReasoningEffort is true.
                  example: medium
                supportsResponseSchema:
                  type: boolean
                  description: Does the LLM model support response schema? Only models that support function calling can support response_schema.
                  example: true
                supportsMultipleImages:
                  type: boolean
                  description: Does the LLM support multiple images in a single request? Only applicable when supportsVision is true.
                  example: true
                maxImages:
                  type: number
                  description: Maximum number of images supported per request. Only present when supportsMultipleImages is true.
                  example: 10
                maxVideos:
                  type: number
                  description: Maximum number of video attachments supported per chat request. Only present when supportsVideoInput is true.
                  example: 4
                supportsVision:
                  type: boolean
                  description: Does the LLM support vision?
                  example: true
                supportsVideoInput:
                  type: boolean
                  description: Does the LLM support video input?
                  example: true
                supportsWebSearch:
                  type: boolean
                  description: Does the LLM model support web search?
                  example: true
                supportsLogProbs:
                  type: boolean
                  description: Does the LLM model support logprobs parameter?
                  example: true
                supportsTeeAttestation:
                  type: boolean
                  description: Does the model run inside a Trusted Execution Environment (TEE) with hardware attestation? When true, use GET /tee/attestation and GET /tee/signature to cryptographically verify that inference occurred inside a genuine TEE.
                  example: false
                supportsE2EE:
                  type: boolean
                  description: Does the model support End-to-End Encryption (E2EE)? When true, clients can encrypt prompts using the TEE public key from attestation, and responses are returned encrypted. Requires supportsTeeAttestation to also be true.
                  example: false
                supportsXSearch:
                  type: boolean
                  description: Does the model support xAI's native X Search (web + X/Twitter search)? When true, you can use venice_parameters.enable_x_search to activate real-time search powered by xAI.
                  example: false
              required:
              - optimizedForCode
              - quantization
              - supportsFunctionCalling
              - supportsAudioInput
              - supportsReasoning
              - supportsReasoningEffort
              - supportsResponseSchema
              - supportsMultipleImages
              - supportsVision
              - supportsVideoInput
              - supportsWebSearch
              - supportsLogProbs
              - supportsTeeAttestation
              - supportsE2EE
              - supportsXSearch
              additionalProperties: false
              description: Text model specific capabilities.
            constraints:
              anyOf:
              - type: object
                properties:
                  aspectRatios:
                    type: array
                    items:
                      type: string
                    description: Supported aspect ratio options for this model. Only present for models that support aspect ratio selection.
                    example:
                    - 61
                    - 969
                    - 556
                    - 182
                    - 123
                  defaultAspectRatio:
                    type: string
                    description: The default aspect ratio for this model. Only present for models that support aspect ratio selection.
                    example: 61
                  defaultResolution:
                    type: string
                    description: The default resolution for this model. Only present for models that support resolution selection.
                    example: 1K
                  resolutions:
                    type: array
                    items:
                      type: string
                    description: Supported resolution options for this model. Only present for models that support resolution selection.
                    example:
                    - 1K
                    - 2K
                    - 4K
                  defaultQuality:
                    type: string
                    enum:
                    - low
                    - medium
                    - high
                    description: The default quality for this model. Only present for models that accept the `quality` request parameter (currently GPT Image 2).
                    example: high
                  qualities:
                    type: array
                    items:
                      type: string
                      enum:
                      - low
                      - medium
                      - high
                    description: Supported quality options for this model. Only present for models that accept the `quality` request parameter (currently GPT Image 2).
                    example:
                    - low
                    - medium
                    - high
                  promptCharacterLimit:
                    type: number
                    description: The maximum supported prompt length.
                    example: 2048
                  steps:
                    type: object
                    properties:
                      default:
                        type: number
                        description: The default steps value for the model
                        example: 25
                      max:
                        type: number
                        description: The maximum supported steps value for the model
                        example: 50
                    required:
                    - default
                    - max
                  widthHeightDivisor:
                    type: number
                    description: The requested width and height of the image generation must be divisible by this value.
                    example: 8
                  maxStyleReferences:
                    type: number
                    description: Maximum number of style_references accepted by POST /image/generate. Only present for models that support style references.
                    example: 3
                  supportsStyleReferenceStrength:
                    type: boolean
                    description: Whether per-reference `strength` is honored. When false, style_references strength is ignored. Only present for models that support style references.
                    example: true
                required:
                - promptCharacterLimit
                - steps
                - widthHeightDivisor
                description: Constraints that apply to image models.
                title: Image Model Constraints
              - type: object
                properties:
                  temperature:
                    type: object
                    properties:
                      default:
                        type: number
                        description: The default temperature value for the model
                        example: 0.7
                    required:
                    - default
                  top_p:
                    type: object
                    properties:
                      default:
                        type: number
                        description: The default top_p value for the model
                        example: 0.9
                    required:
                    - default
                  frequency_penalty:
                    type: object
                    properties:
                      default:
                        type: number
                        description: The default frequency_penalty value for the model
                        example: 0
                    required:
                    - default
                  presence_penalty:
                    type: object
                    properties:
                      default:
                        type: number
                        description: The default presence_penalty value for the model
                        example: 0
                    required:
                    - default
                  repetition_penalty:
                    type: object
                    properties:
                      default:
                        type: number
                        description: The default repetition_penalty value for the model
                        example: 1.05
                    required:
                    - default
                required:
                - temperature
                - top_p
                description: Constraints that apply to text models.
                title: Text Model Constraints
              - type: object
                properties:
                  aspect_ratios:
                    type: array
                    items:
                      type: string
                    description: The aspect ratios supported by the model. Empty array means the model does not support a defined aspect ratio.
                    example:
                    - 969
                    - 556
                  resolutions:
                    type: array
                    items:
                      type: string
                    description: The resolutions supported by the model. Empty array means the model does not support a defined resolution.
                    example:
                    - 1080p
                    - 720p
                    - 480p
                  durations:
                    type: array
                    items:
                      type: string
                    description: The durations supported by the model. Empty array means the model does not support a defined duration.
                    example:
                    - 5s
                    - 10s
                    - 15s
                    - 20s
                    - 30s
                  model_type:
                    type: string
                    enum:
                    - image-to-video
                    - text-to-video
                    - video
                    description: The type of video model.
                    example: image-to-video
                  audio:
                    type: boolean
                    description: Does the model support audio generation?
                    example: true
                  audio_configurable:
                    type: boolean
                    description: Can audio be enabled or disabled for the video generation?
                    example: true
                  prompt_character_limit:
                    type: number
                    description: The maximum supported prompt length for this video model. If not specified, the default is 2500 characters.
                    example: 1000
                  topaz:
                    type: object
                    properties:
                      models:
                        type: array
                        items:
                          type: object
                          properties:
                            display:
                              type: string
                            value:
                              type: string
                          required:
                          - display
                          - value
                        description: Available values for the `enhancement_model` request parameter.
                      sliders:
                        type: array
                        items:
                          type: object
                          properties:
                            default:
                              type: number
                            max:
                              type: number
                            min:
                              type: number
                            param:
                              type: string
                            only_for_models:
                              type: array
                              items:
                                type: string
                              description: When present, the parameter only applies to these enhancement models.
                          required:
                          - default
                          - max
                          - min
                          - param
                        description: Numeric enhancement parameters with their valid ranges and defaults.
                      no_upscale_models:
                        type: array
                        items:
                          type: string
                        description: Enhancement models that must run at source resolution (upscale_factor > 1 is rejected with them).
                      selects:
                        type: array
                        items:
                          type: object
                          properties:
                            default:
                              type: string
                            options:
                              type: array
                              items:
                                type: string
                            param:
                              type: string
                          required:
                          - default
                          - options
                          - param
                        description: Enum-style enhancement parameters (e.g. `target_fps`, `output_format`, `slowdown_factor`).
                      h264_output:
                        type: boolean
                        description: Whether the model accepts the `h264_output` parameter.
                      prompt:
                        type: boolean
                        description: Whether the model accepts an optional guidance `prompt` (e.g. Topaz Astra).
                    description: Topaz enhancement controls supported by this model. Absent for regular generation models.
                required:
                - aspect_ratios
                - resolutions
                - durations
                - model_type
                - audio
                - audio_configurable
                description: Constraints that apply to video models.
                title: Video Model Constraints
              - type: object
                properties:
                  aspectRatios:
                    type: array
                    items:
                      type: string
                    description: The aspect ratios supported by this model. Omit the parameter to use the model's default setting.
                    example:
                    - auto
                    - 61
                    - 969
                    - 556
                  promptCharacterLimit:
                    type: number
                    description: The maximum supported prompt length.
                    example: 1500
                  combineImages:
                    type: boolean
                    description: Whether this model supports combining multiple input images.
                    example: true
                  maxInputImages:
                    type: integer
                    description: Maximum number of input images accepted for combine/multi-edit. Absent means the default of 3 (or 1 when combineImages is false).
                    example: 14
                    exclusiveMinimum: 0
                  singleImageAspectRatio:
                    type: boolean
                    description: If false, output dimensions match the input on single-image edits and `aspect_ratio` is ignored. Multi-image edits are unaffected. Defaults to true.
                    example: true
                  defaultResolution:
                    type: string
                    description: The default resolution for this inpaint model. Only present for models that support resolution selection (e.g. GPT Image 2 Edit).
                    example: 1K
                  resolutions:
                    type: array
                    items:
                      type: string
                    description: Supported resolution options for this inpaint model. Only present for models that support resolution selection.
                    example:
                    - 1K
                    - 2K
                    - 4K
                  defaultQuality:
                    type: string
                    enum:
                    - low
                    - medium
                    - high
                    description: The default quality for this inpaint model. Only present for models that accept the `quality` request parameter (currently GPT Image 2 Edit).
                    example: high
                  qualities:
                    type: array
                    items:
                      type: string
                      enum:
                      - low
                      - medium
                      - high
                    description: Supported quality options for this inpaint model. Only present for models that accept the `quality` request parameter (currently GPT Image 2 Edit).
                    example:
                    - low
                    - medium
                    - high
                required:
                - aspectRatios
                - promptCharacterLimit
                - combineImages
                description: Constraints that apply to inpaint/edit models.
                title: Inpaint Model Constraints
              description: Constraints that apply to this model.
            supportsStyleReferences:
              type: boolean
              description: Whether this image model accepts `style_references` on POST /image/generate. Only present for image models.
              example: true
            description:
              type: string
              description: A human-readable description of the model and its capabilities.
              example: Balanced blend of speed and capability. Handles most everyday tasks with reliability.
            name:
              type: string
              description: The name of the model.
              example: Gemini 3.6 Flash
            modelSource:
              type: string
              description: The source of the model, such as a URL to the model repository.
              example: ''
            offline:
              type: boolean
              default: false
              description: Is this model presently offline?
              example: false
            pricing:
              anyOf:
              - type: object
                properties:
                  input:
                    type: object
                    properties:
                      usd:
                        type: number
                        description: USD cost per million input tokens
                        example: 0.7
                      diem:
                        type: number
                        description: Diem cost per million input tokens
                        example: 7
                    required:
                    - usd
                    - diem
                  cache_input:
                    type: object
                    properties:
                      usd:
                        type: number
                        description: USD cost per million cached input tokens (discounted rate for cache reads)
                        example: 0.35
                      diem:
                        type: number
                        description: Diem cost per million cached input tokens (discounted rate for cache reads)
                        example: 3.5
                    required:
                    - usd
                    - diem
                    description: Optional pricing for cached input tokens (cache reads). Only present for models that support context caching.
                  cache_write:
                    type: object
                    properties:
                      usd:
                        type: number
                        description: USD cost per million cache creation tokens (cache writes). For some providers this may be higher than input price.
                        example: 7.5
                      diem:
                        type: number
                        description: Diem cost per million cache creation tokens (cache writes). For some providers this may be higher than input price.
                        example: 75
                    required:
                    - usd
                    - diem
                    description: Optional pricing for cache creation tokens (cache writes). Only present for models where provider charges for cache writes (e.g., Anthropic charges 1.25x input price).
                  output:
                    type: object
                    properties:
                      usd:
                        type: number
                        description: USD cost per million output tokens
                        example: 2.8
                      diem:
                        type: number
                        description: Diem cost per million output tokens
                        example: 28
                    required:
                    - usd
                    - diem
                  extended:
                    type: object
                    properties:
                      context_token_threshold:
                        type: number
                        description: Input token count above which extended pricing applies
                        example: 200000
                      input:
                        type: object
                        properties:
                          usd:
                            type: number
                            description: USD cost per million input tokens (extended tier)
                            example: 11
                          diem:
                            type: number
                            description: Diem cost per million input tokens (extended tier)
                            example: 11
                        required:
                        - usd
                        - diem
                      output:
                        type: object
                        properties:
                          usd:
                            type: number
                            description: USD cost per million output tokens (extended tier)
                            example: 41.25
                          diem:
                            type: number
