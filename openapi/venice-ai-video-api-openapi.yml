openapi: 3.2.0
info:
  title: Venice Ai Video API
  version: '20261012.214344'
  termsOfService: https://venice.ai/legal/tos
  x-guidance: 'Venice.ai is an OpenAI-compatible inference API supporting text, image, audio, and video generation.


    **Authentication options:**

    - API Key: Use Bearer token in Authorization header

    - x402 Wallet: Use USDC credits via EVM or Solana wallet (no account required)


    **For x402 wallet access:**

    1. POST /x402/top-up without headers to get payment requirements

    2. Choose one of the returned Base or Solana payment options and sign a USDC payment using the x402 SDK

    3. POST /x402/top-up with PAYMENT-SIGNATURE header to add credits

    4. Call any inference endpoint with SIGN-IN-WITH-X header


    **Pricing:** Prepaid credits consumed per request. Check /models for available models and their capabilities.'
  description: 'Operations tagged Video across 2 of this provider''s published API definitions: venice-ai-swagger.yaml, venice-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.venice.ai/api/v1
security:
- BearerAuth: []
tags:
- description: Generate videos using AI models.
  name: Video
paths:
  /video/complete:
    post:
      description: 'Delete a video generation request from storage after it has been successfully downloaded. Videos can be automatically deleted after retrieval by setting the `delete_media_on_completion` flag to true when calling the retrieve API.


        **Authentication:** This endpoint accepts either a Bearer API key or a `SIGN-IN-WITH-X` header for x402 wallet-based authentication. The legacy `X-Sign-In-With-X` header is also accepted during migration. When using x402, a `402 Payment Required` response indicates insufficient balance and includes top-up instructions.'
      operationId: completeVideo
      security:
      - BearerAuth: []
      - siwx: []
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: '0.001'
          max: '10.00'
        protocols:
        - x402: {}
      summary: /api/v1/video/complete
      tags:
      - Video
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteVideoRequest'
      responses:
        '200':
          description: Video generation request completed successfully
          headers:
            X-Balance-Remaining:
              description: Remaining x402 credit balance in USD after this request (only present for x402 auth).
              required: false
              schema:
                type: string
                example: '4.230000'
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Indicates whether the video cleanup was successful.
                    example: true
                required:
                - success
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedError'
        '401':
          description: '- Authentication failed

            - This model is only available to Pro users'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '402':
          description: 'Payment or balance required. Response varies by authentication state:


            **API Key users:** Standard error response with `INSUFFICIENT_BALANCE` code. Top up your Venice balance at venice.ai.


            **Unauthenticated x402 discovery:** Structured x402 response with `x402Version`, `resource`, `accepts`, and `extensions["sign-in-with-x"]`. The `accepts` array advertises Base and Solana payment requirements.


            **Authenticated x402 wallet users with insufficient credit:** Structured response with `PAYMENT_REQUIRED` code containing:

            - `topUpInstructions`: Step-by-step guide to top up via x402 protocol

            - `supportedTokens` / `supportedChains`: Accepted payment methods

            - `siwxChallenge`: Fresh Sign-In-With-X challenge metadata


            The `PAYMENT-REQUIRED` header also contains a base64-encoded x402 protocol object with the payment requirements for programmatic discovery.'
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded JSON with x402 payment requirements. Present on x402 middleware 402 responses. Decode to choose and sign one accepted payment requirement programmatically.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/StandardError'
                - $ref: '#/components/schemas/X402InferencePaymentRequired'
        '403':
          $ref: '#/components/responses/ApiKeyIpRestrictedError'
        '500':
          description: Inference processing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
  /video/queue:
    post:
      description: 'Queue a new video generation request.


        **Authentication:** This endpoint accepts either a Bearer API key or a `SIGN-IN-WITH-X` header for x402 wallet-based authentication. The legacy `X-Sign-In-With-X` header is also accepted during migration. When using x402, a `402 Payment Required` response indicates insufficient balance and includes top-up instructions.'
      operationId: queueVideo
      security:
      - BearerAuth: []
      - siwx: []
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: '0.001'
          max: '10.00'
        protocols:
        - x402: {}
      summary: /api/v1/video/queue
      tags:
      - Video
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueVideoRequest'
      responses:
        '200':
          description: Video generation request queued successfully
          headers:
            X-Balance-Remaining:
              description: Remaining x402 credit balance in USD after this request (only present for x402 auth).
              required: false
              schema:
                type: string
                example: '4.230000'
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: string
                    description: The ID of the model used for video generation.
                    example: video-model-123
                  queue_id:
                    type: string
                    description: The ID of the video generation request.
                    example: 123e4567-e89b-12d3-a456-426614174000
                  download_url:
                    type: string
                    description: Pre-signed URL to download the completed video. Only present for VPS-backed models. When provided, the retrieve endpoint returns JSON status only (no video stream). Fetch this URL after status is COMPLETED to get the video/mp4 file. Valid for 24 hours.
                required:
                - model
                - queue_id
                additionalProperties: false
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedError'
        '401':
          description: '- Authentication failed

            - This model is only available to Pro users'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '402':
          description: 'Payment or balance required. Response varies by authentication state:


            **API Key users:** Standard error response with `INSUFFICIENT_BALANCE` code. Top up your Venice balance at venice.ai.


            **Unauthenticated x402 discovery:** Structured x402 response with `x402Version`, `resource`, `accepts`, and `extensions["sign-in-with-x"]`. The `accepts` array advertises Base and Solana payment requirements.


            **Authenticated x402 wallet users with insufficient credit:** Structured response with `PAYMENT_REQUIRED` code containing:

            - `topUpInstructions`: Step-by-step guide to top up via x402 protocol

            - `supportedTokens` / `supportedChains`: Accepted payment methods

            - `siwxChallenge`: Fresh Sign-In-With-X challenge metadata


            The `PAYMENT-REQUIRED` header also contains a base64-encoded x402 protocol object with the payment requirements for programmatic discovery.'
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded JSON with x402 payment requirements. Present on x402 middleware 402 responses. Decode to choose and sign one accepted payment requirement programmatically.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/StandardError'
                - $ref: '#/components/schemas/X402InferencePaymentRequired'
        '403':
          description: 'The specified model is unavailable in your region. Use of Tor, VPNs, proxies, or other means to circumvent this restriction is a violation of our Terms of Service.


            This API key is restricted to configured IP addresses, and this request''s source IP is not allowed'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/StandardError'
                - $ref: '#/components/schemas/ApiKeyIpRestrictedError'
        '409':
          description: Additional consent is required before this request can be queued for some models
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                        - needs_consent
                      message:
                        type: string
                    required:
                    - code
                    - message
                    additionalProperties: false
                  consent_flow:
                    type: string
                    enum:
                    - seedance
                  face_media_roles:
                    type: array
                    items:
                      type: string
                      enum:
                      - image
                      - end_image
                      - reference_image
                      - video
                      - reference_video
                  consent:
                    type: object
                    properties:
                      consent_version:
                        type: string
                      policy_text:
                        type: string
                    required:
                    - consent_version
                    - policy_text
                    additionalProperties: false
                  docs_url:
                    type: string
                required:
                - error
                - consent_flow
                - face_media_roles
                - consent
                - docs_url
                additionalProperties: false
        '413':
          description: The request payload is too large. Please reduce the size of your request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayloadTooLargeError'
        '422':
          description: Your prompt violates the content policy of Venice.ai or the model provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentViolationError'
        '500':
          description: Inference processing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
  /video/quote:
    post:
      description: Quote a video generation request based on pricing inputs (model, duration, resolution, aspect_ratio, audio). Returns the price in USD.
      operationId: quoteVideo
      summary: /api/v1/video/quote
      tags:
      - Video
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteVideoRequest'
      responses:
        '200':
          description: Video generation price quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote:
                    type: number
                required:
                - quote
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedError'
        '403':
          description: 'The specified model is unavailable in your region. Use of Tor, VPNs, proxies, or other means to circumvent this restriction is a violation of our Terms of Service.


            This API key is restricted to configured IP addresses, and this request''s source IP is not allowed'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/StandardError'
                - $ref: '#/components/schemas/ApiKeyIpRestrictedError'
    servers:
    - url: https://api.venice.ai/api/v1
  /video/retrieve:
    post:
      description: 'Retrieve a video generation result. Returns the video file if completed, or a status if the request is still processing.


        **Authentication:** This endpoint accepts either a Bearer API key or a `SIGN-IN-WITH-X` header for x402 wallet-based authentication. The legacy `X-Sign-In-With-X` header is also accepted during migration. When using x402, a `402 Payment Required` response indicates insufficient balance and includes top-up instructions.'
      operationId: retrieveVideo
      security:
      - BearerAuth: []
      - siwx: []
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: '0.001'
          max: '10.00'
        protocols:
        - x402: {}
      summary: /api/v1/video/retrieve
      tags:
      - Video
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveVideoRequest'
      responses:
        '200':
          description: Video file if completed, or processing status if still in progress
          headers:
            X-Balance-Remaining:
              description: Remaining x402 credit balance in USD after this request (only present for x402 auth).
              required: false
              schema:
                type: string
                example: '4.230000'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - PROCESSING
                    - COMPLETED
                    description: The status of the video generation request.
                    example: PROCESSING
                  average_execution_time:
                    type: number
                    description: The estimated execution time of the video generation request in milliseconds (P80).
                    example: 145000
                  execution_duration:
                    type: number
                    description: The current duration of the video generation request in milliseconds.
                    example: 53200
                required:
                - status
                - average_execution_time
                - execution_duration
            video/mp4:
              schema:
                format: binary
                type: string
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedError'
        '401':
          description: '- Authentication failed

            - This model is only available to Pro users'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '402':
          description: 'Payment or balance required. Response varies by authentication state:


            **API Key users:** Standard error response with `INSUFFICIENT_BALANCE` code. Top up your Venice balance at venice.ai.


            **Unauthenticated x402 discovery:** Structured x402 response with `x402Version`, `resource`, `accepts`, and `extensions["sign-in-with-x"]`. The `accepts` array advertises Base and Solana payment requirements.


            **Authenticated x402 wallet users with insufficient credit:** Structured response with `PAYMENT_REQUIRED` code containing:

            - `topUpInstructions`: Step-by-step guide to top up via x402 protocol

            - `supportedTokens` / `supportedChains`: Accepted payment methods

            - `siwxChallenge`: Fresh Sign-In-With-X challenge metadata


            The `PAYMENT-REQUIRED` header also contains a base64-encoded x402 protocol object with the payment requirements for programmatic discovery.'
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded JSON with x402 payment requirements. Present on x402 middleware 402 responses. Decode to choose and sign one accepted payment requirement programmatically.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/StandardError'
                - $ref: '#/components/schemas/X402InferencePaymentRequired'
        '403':
          description: 'The specified model is unavailable in your region. Use of Tor, VPNs, proxies, or other means to circumvent this restriction is a violation of our Terms of Service.


            This API key is restricted to configured IP addresses, and this request''s source IP is not allowed'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/StandardError'
                - $ref: '#/components/schemas/ApiKeyIpRestrictedError'
        '404':
          description: Media could not be found. Request may may be invalid, expired, or deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '422':
          description: The selected model provider rejected this request due to its content policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderContentPolicyError'
        '500':
          description: Inference processing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '503':
          description: The model is at capacity. Please try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
  /video/transcriptions:
    post:
      deprecated: true
      description: This beta endpoint has been deprecated and is no longer available. It answers every request with a 410. For video analysis, summarization, or questions about a video, use POST /api/v1/chat/completions with the video URL passed as video_url and select a model where model_spec.capabilities.supportsVideoInput is true. Available models and their capabilities can be found via GET /api/v1/models.
      operationId: createVideoTranscription
      security: []
      summary: /api/v1/video/transcriptions
      tags:
      - Video
      responses:
        '410':
          description: This beta endpoint has been deprecated and is no longer available. The error message names POST /api/v1/chat/completions with video_url and GET /api/v1/models.
          headers:
            Deprecation:
              schema:
                description: RFC 9745 flag that this endpoint is deprecated
                example: 'true'
                type: string
            Link:
              schema:
                description: Points to chat completions as the replacement and to the models list
                example: </api/v1/chat/completions>; rel="successor-version"
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
components:
  schemas:
    QuoteVideoRequest:
      type: object
      properties:
        model:
          type: string
          description: The model to get a price quote for.
          example: seedance-2-0-text-to-video-basic
        duration:
          type: string
          enum:
          - 1s
          - 2s
          - 3s
          - 4s
          - 5s
          - 6s
          - 7s
          - 8s
          - 9s
          - 10s
          - 11s
          - 12s
          - 13s
          - 14s
          - 15s
          - 16s
          - 17s
          - 18s
          - 19s
          - 20s
          - 21s
          - 22s
          - 23s
          - 24s
          - 25s
          - 26s
          - 27s
          - 28s
          - 29s
          - 30s
          - '-1'
          - 1 gen
          - auto
          - Auto
          description: The duration of the video. Available options vary by model. For Seedance 2.5 reference-to-video edit jobs, `-1` or `auto` matches output length to the source clip (requires reference_video_urls on queue, or reference_video_total_duration on quote; source must be 4–30s).
          example: 10s
        aspect_ratio:
          type: string
          enum:
          - 61
          - 123
          - 182
          - 184
          - 243
          - 245
          - 304
          - 556
          - 561
          - 969
          - 1269
          - adaptive
          - auto
          description: The aspect ratio. Required for some models with megapixel-rate pricing. For Seedance 2.x reference-to-video edit/extend, `adaptive` or `auto` matches output aspect ratio to the source clip (requires reference_video_urls on queue, or reference_video_total_duration on quote).
          example: 969
        resolution:
          type: string
          enum:
          - 256p
          - 360p
          - 480p
          - 540p
          - 580p
          - 720p
          - 1080p
          - 1440p
          - 2160p
          - 2k
          - 4k
          - 1x
          - 2x
          - 4x
          - 2K
          - 480P
          - 768P
          - 1080P
          - true_1080p
          description: The resolution. Required for models with duration-resolution-rate pricing.
          example: 720p
        upscale_factor:
          type: integer
          description: For upscale models only. The upscale multiplier the queue request will use (1, 2 or 4); the quote bills the output tier of source height × factor. Defaults to the model's default factor.
          enum:
          - 1
          - 2
          - 4
          example: 2
        enhancement_model:
          type: string
          description: For enhancement models only. The provider-side enhancement model. Available values are listed per model in GET /models constraints.topaz.models.
          example: Proteus
        target_fps:
          type: integer
          description: For enhancement models only. Target FPS for frame interpolation (16-120). Doubles the price on upscaling endpoints when ≥48; scales linearly on interpolation. Omit to keep the source frame rate.
          example: 60
        slowdown_factor:
          type: integer
          description: 'For enhancement models only (frame interpolation). Slow-motion factor: 2 makes the output twice as long at the target FPS, up to 8x. Multiplies the billed duration.'
          enum:
          - 1
          - 2
          - 4
          - 8
          example: 1
        audio:
          type: boolean
          default: true
          description: For models which support audio generation and configuration. Defaults to true.
          example: true
        video_url:
          type: string
          description: For upscale models, the video to upscale. Required to auto-detect duration for pricing.
          example: data:video/mp4;base64,AAAAFGZ0eXA...
        reference_video_total_duration:
          type: number
          minimum: 0
          description: For R2V models (e.g. Seedance 2.0 / 2.5 R2V), the aggregate duration in seconds of all reference videos to include in the quote (max 150s; per-clip and family caps vary by model). When provided, the quote reflects the BytePlus 'input with video' rate tier and the (input+output)×pixels token formula. Required when quoting Seedance source-matched duration (`-1`/`auto`) or aspect ratio (`adaptive`/`auto`). When omitted for ordinary fixed-duration quotes, the quote returns the no-reference baseline.
          example: 5
      required:
      - model
      - duration
      description: Request body for video price quote. Available fields and valid values vary by model.
    QueueVideoRequest:
      type: object
      properties:
        model:
          type: string
          description: The model to use for video generation.
          example: seedance-2-0-text-to-video-basic
        consents:
          type: object
          properties:
            seedance:
              type: object
              properties:
                confirmed_terms_and_privacy:
                  type: boolean
                  enum:
                  - true
                  description: Confirms acceptance of the current provider policy text returned in the needs_consent response.
                  example: true
                confirmed_legal_right:
                  type: boolean
                  enum:
                  - true
                  description: Confirms the API user has the legal right to use the submitted media.
                  example: true
                confirmed_screening_acknowledged:
                  type: boolean
                  enum:
                  - true
                  description: Acknowledges that submitted media may be screened before processing.
                  example: true
              required:
              - confirmed_terms_and_privacy
              - confirmed_legal_right
              - confirmed_screening_acknowledged
          description: Optional provider-specific consent attestations. Required only for models that return a needs_consent response.
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
          description: The prompt to use for video generation. Required for most models; optional for H3 Max Multi-Angle. The maximum length varies by model (default 2500 characters, up to 20000 for some models).
          example: Commerce being conducted in the city of Venice, Italy.
        negative_prompt:
          type: string
          maxLength: 20000
          description: Optional negative prompt. The maximum length varies by model (default 2500 characters, up to 20000 for some models).
          example: low resolution, error, worst quality, low quality, defects
        duration:
          type: string
          enum:
          - 1s
          - 2s
          - 3s
          - 4s
          - 5s
          - 6s
          - 7s
          - 8s
          - 9s
          - 10s
          - 11s
          - 12s
          - 13s
          - 14s
          - 15s
          - 16s
          - 17s
          - 18s
          - 19s
          - 20s
          - 21s
          - 22s
          - 23s
          - 24s
          - 25s
          - 26s
          - 27s
          - 28s
          - 29s
          - 30s
          - '-1'
          - 1 gen
          - auto
          - Auto
          description: The duration of the video to generate. Available options vary by model. For Seedance 2.5 reference-to-video edit jobs, `-1` or `auto` matches output length to the source clip (requires reference_video_urls on queue, or reference_video_total_duration on quote; source must be 4–30s).
          example: 10s
        aspect_ratio:
          type: string
          enum:
          - 61
          - 123
          - 182
          - 184
          - 243
          - 245
          - 304
          - 556
          - 561
          - 969
          - 1269
          - adaptive
          - auto
          description: The aspect ratio of the video. Available options vary by model. Some models do not support aspect_ratio. For Seedance 2.x reference-to-video edit/extend, `adaptive` or `auto` matches output aspect ratio to the source clip (requires reference_video_urls on queue, or reference_video_total_duration on quote).
          example: 969
        omni_reference_task_type:
          type: string
          enum:
          - auto
          - reference
          - edit
          - extend
          description: Optional Seedance 2.5 reference-to-video task-type hint forwarded to BytePlus (`auto` | `reference` | `edit` | `extend`). Aliases `editing`→`edit` and `extension`→`extend` are accepted on the queue API. Pre-guides classification to reduce async TaskTypeConstraint errors. The prompt must still match the chosen type. When omitted, Venice infers from the prompt if reference_video_urls are present. Not supported on other models.
          example: edit
        resolution:
          type: string
          enum:
          - 256p
          - 360p
          - 480p
          - 540p
          - 580p
          - 720p
          - 1080p
          - 1440p
          - 2160p
          - 2k
          - 4k
          - 1x
          - 2x
          - 4x
          - 2K
          - 480P
          - 768P
          - 1080P
          - true_1080p
          description: The resolution of the video. Available options vary by model. Some models do not support resolution. Use upscale_factor for upscale models.
          example: 720p
        upscale_factor:
          type: integer
          description: For upscale models only. 1 = quality enhancement, 2 = double resolution (default), 4 = quadruple.
          enum:
          - 1
          - 2
          - 4
          default: 2
          example: 2
        enhancement_model:
          type: string
          description: For enhancement models only. The provider-side enhancement model. Available values are listed per model in GET /models constraints.topaz.models.
          example: Proteus
        target_fps:
          type: integer
          description: For enhancement models only. Target FPS for frame interpolation (16-120). Doubles the price on upscaling endpoints when ≥48; scales linearly on interpolation. Omit to keep the source frame rate.
          example: 60
        softness:
          type: number
          minimum: 1
          maximum: 5
          description: For enhancement models only. Softness level (1-5, sharpest to softest).
          example: 3
        creativity:
          type: number
          minimum: 0
          maximum: 1
