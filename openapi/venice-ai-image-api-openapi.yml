                    - nano-banana-2-edit
                    - nano-banana-2-1-edit
                    - nano-banana-pro-edit
                    - nano-banana-2-lite-edit
                    - luma-uni-1-edit
                    - luma-uni-1-max-edit
                    - muse-image-edit
