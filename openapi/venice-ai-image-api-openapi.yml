                    - seedream-v5-pro-edit
                    - seedream-v4-edit
                    - qwen-image-3-edit
                    - qwen-image-3-pro-edit
                    - qwen-image-2-1-turbo-edit
                    - qwen-image-2-1-pro-edit
      security:
      - BearerAuth: []
      - siwx: []
      x-payment-info:
        price:
          mode: dynamic
