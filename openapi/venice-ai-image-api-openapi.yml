      description: List available image styles that can be used with the generate API.
      security:
      - {}
      - BearerAuth: []
      summary: /api/v1/image/styles
      tags:
      - Image
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                    description: List of available image styles
                    example:
                    - 3D Model
                    - Analog Film
                    - Anime
                    - Cinematic
                    - Comic Book
                  object:
