                    - qwen-edit-uncensored
                    - grok-imagine-edit
                    - grok-imagine-quality-edit
                    - grok-imagine-image-2-0-edit
                    - qwen-image-2-edit
                    - qwen-image-2-pro-edit
                    - wan-2-7-pro-edit
                    - flux-2-max-edit
                    - flux-3-image-edit
                    - gpt-image-2-5-flare-edit
                    - gpt-image-2-5-sunburst-edit
                    - gpt-image-2-edit
                    - gpt-image-1-5-edit
                    - ideogram-v4-5-edit
                    - nano-banana-2-edit
                    - nano-banana-2-1-edit
                    - nano-banana-pro-edit
                    - nano-banana-2-lite-edit
                    - luma-uni-1-edit
                    - luma-uni-1-max-edit
                    - muse-image-edit
