          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: integer
                    description: Unix timestamp for when the request was created
                    example: 1713833628
                  data:
                    type: array
                    items:
                      anyOf:
                      - type: object
                        properties:
                          b64_json:
                            type: string
                            description: Base64-encoded JSON string of the generated image
                            example: iVBORw0KGgoAAAANSUhEUgAA...
                        required:
                        - b64_json
                      - type: object
                        properties:
                          url:
                            type: string
                            description: Data URL of the generated image
                            example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
                        required:
                        - url
                required:
                - created
                - data
                additionalProperties: false
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedError'
        '401':
          description: '- Authentication failed

            - This model is only available to Pro users'
          content:
