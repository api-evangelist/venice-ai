openapi: 3.2.0
info:
  title: Venice Ai Billing API
  version: '20261012.214344'
  termsOfService: https://venice.ai/legal/tos
  x-guidance: 'Venice.ai is an OpenAI-compatible inference API supporting text, image, audio, and video generation.


    **Authentication options:**

    - API Key: Use Bearer token in Authorization header

    - x402 Wallet: Use USDC credits via EVM or Solana wallet (no account required)


    **For x402 wallet access:**

    1. POST /x402/top-up without headers to get payment requirements

    2. Choose one of the returned Base or Solana payment options and sign a USDC payment using the x402 SDK

    3. POST /x402/top-up with PAYMENT-SIGNATURE header to add credits

    4. Call any inference endpoint with SIGN-IN-WITH-X header


    **Pricing:** Prepaid credits consumed per request. Check /models for available models and their capabilities.'
  description: 'Operations tagged Billing across 2 of this provider''s published API definitions: venice-ai-swagger.yaml, venice-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.venice.ai/api/v1
security:
- BearerAuth: []
tags:
- description: 'Billing and usage analytics. **Beta**: This API is currently in beta and may be unstable. Endpoints, request/response schemas, and behavior may change without notice.'
  name: Billing
paths:
  /billing/balance:
    get:
      description: Get current balance information for the authenticated user. Returns remaining DIEM/USD balances and total DIEM epoch allocation for calculating usage percentage.
      operationId: getBillingBalance
      summary: /api/v1/billing/balance
      tags:
      - Billing
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  canConsume:
                    type: boolean
                    description: Whether the user has sufficient balance to make API requests
                    example: true
                  consumptionCurrency:
                    type:
                    - string
                    - 'null'
                    enum:
                    - USD
                    - VCU
                    - DIEM
                    - BUNDLED_CREDITS
                    - EARNED_CREDITS
                    description: The currency that will be used for consumption (DIEM, EARNED_CREDITS, BUNDLED_CREDITS or USD)
                    example: DIEM
                  balances:
                    type: object
                    properties:
                      diem:
                        type:
                        - number
                        - 'null'
                        description: Remaining DIEM balance for current epoch. Null if not staking.
                        example: 90.5
                      usd:
                        type:
                        - number
                        - 'null'
                        description: Remaining USD balance. Null if not available.
                        example: 25
                      bundledCredits:
                        type:
                        - number
                        - 'null'
                        description: Remaining bundled credits balance. Null if not available.
                        example: 10
                      earnedCredits:
                        type:
                        - number
                        - 'null'
                        description: Remaining earned credits balance. Null if not available.
                        example: 5
                    required:
                    - diem
                    - usd
                    - bundledCredits
                    - earnedCredits
                  diemEpochAllocation:
                    type: number
                    description: Total DIEM allocation for the current epoch (from staking). Use with balances.diem to calculate usage percentage.
                    example: 100
                required:
                - canConsume
                - consumptionCurrency
                - balances
                - diemEpochAllocation
                additionalProperties: false
                description: Current balance information for the authenticated user
                example:
                  canConsume: true
                  consumptionCurrency: DIEM
                  balances:
                    diem: 90.5
                    usd: 25
                    bundledCredits: 10
                    earnedCredits: 5
                  diemEpochAllocation: 100
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          $ref: '#/components/responses/ApiKeyIpRestrictedError'
        '500':
          description: Inference processing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
  /billing/usage:
    get:
      deprecated: true
      description: 'SUNSET as of 2026-09-16: this endpoint no longer returns usage data and answers every request with a 410. Use GET /api/v1/billing/usage-history instead, which returns the same ledger entries with cursor pagination: replace `page` and `limit` with `pageSize` plus the `nextCursor` from each response, and `startDate` and `endDate` with `startTimestamp` and `endTimestamp`.'
      operationId: getBillingUsage
      security: []
      summary: /api/v1/billing/usage
      tags:
      - Billing
      responses:
        '410':
          description: Sunset on 2026-09-16. The error message names GET /api/v1/billing/usage-history and the parameters to rename.
          headers:
            Deprecation:
              schema:
                description: RFC 9745 date at which the endpoint was deprecated
                example: '@1783555200'
                type: string
            Link:
              schema:
                description: Points to the replacement endpoint
                example: </api/v1/billing/usage-history>; rel="successor-version"
                type: string
            Sunset:
              schema:
                description: RFC 8594 date at which the endpoint stopped returning usage data
                example: Wed, 16 Sep 2026 00:00:00 GMT
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
  /billing/usage-analytics:
    get:
      description: '**Beta**: This endpoint is currently in beta and may be unstable. Request/response schemas and behavior may change without notice.


        Get aggregated usage analytics for the authenticated user with breakdowns by date, model, and API key. This endpoint provides summary views of your API usage, ideal for dashboards and usage monitoring. Data is cached for 10 minutes.'
      operationId: getBillingUsageAnalytics
      summary: /api/v1/billing/usage-analytics
      tags:
      - Billing
      parameters:
      - schema:
          type: string
          pattern: ^[1-9]\d*d$
          default: 7d
          description: 'Lookback period for usage data. Format: number followed by "d" (e.g., "7d", "30d"). Maximum: 90d'
          example: 7d
        required: false
        name: lookback
        in: query
      - schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Start date for filtering records (YYYY-MM-DD). If provided, endDate is also required.
          example: 2024-01-01
        required: false
        name: startDate
        in: query
      - schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: End date for filtering records (YYYY-MM-DD). If provided, startDate is also required.
          example: 2024-01-31
        required: false
        name: endDate
        in: query
      responses:
        '200':
          description: Successful response with aggregated usage analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  lookback:
                    type: string
                    description: The lookback period used for the query. Either "Nd" format or "startDate:endDate" format.
                    example: 7d
                  byDate:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          description: Date in YYYY-MM-DD format
                          example: 2024-01-15
                        USD:
                          type: number
                          description: Total USD usage for this date
                        DIEM:
                          type: number
                          description: Total DIEM usage for this date
                      required:
                      - date
                      - USD
                      - DIEM
                    description: Daily usage totals for the requested period
                  byModel:
                    type: array
                    items:
                      type: object
                      properties:
                        modelName:
                          type: string
                          description: Display name of the model
                          example: GLM 5.1
                        unitType:
                          type: string
                          description: Type of units (tokens, images, chars, minutes, seconds)
                          example: tokens
                        modelType:
                          type:
                          - string
                          - 'null'
                          description: Type of model (LLM, IMAGE, TTS, ASR, VIDEO)
                          example: LLM
                        totalUsd:
                          type: number
                          description: Total USD usage for this model
                        totalDiem:
                          type: number
                          description: Total DIEM usage for this model
                        totalUnits:
                          type: number
                          description: Total units consumed for this model
                        breakdown:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                description: Token type (e.g., "Input", "Output", "Cache Read", "Cache Write")
                              usd:
                                type: number
                                description: USD amount for this breakdown
                              diem:
                                type: number
                                description: DIEM amount for this breakdown
                              units:
                                type: number
                                description: Number of units for this breakdown
                            required:
                            - type
                            - usd
                            - diem
                            - units
                          description: Breakdown by token type (only present if multiple types)
                      required:
                      - modelName
                      - unitType
                      - modelType
                      - totalUsd
                      - totalDiem
                      - totalUnits
                    description: Usage breakdown by model, sorted by total spend (highest first)
                  byModelDaily:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        type: number
                    description: Daily chart data for top 8 models. Each entry has "date" (timestamp) plus model names as keys.
                  topModels:
                    type: array
                    items:
                      type: string
                    description: Names of the top 8 models by usage (for chart legends)
                  byKey:
                    type: array
                    items:
                      type: object
                      properties:
                        apiKeyId:
                          type:
                          - string
                          - 'null'
                          description: API key ID, or null if usage was from web app
                        description:
                          type: string
                          description: API key description or "Web App"
                          example: My Production Key
                        totalUsd:
                          type: number
                          description: Total USD usage for this key
                        totalDiem:
                          type: number
                          description: Total DIEM usage for this key
                        totalUnits:
                          type: number
                          description: Total units consumed for this key
                      required:
                      - apiKeyId
                      - description
                      - totalUsd
                      - totalDiem
                      - totalUnits
                    description: Usage breakdown by API key, sorted by total spend (highest first)
                  byKeyDaily:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        type: number
                    description: Daily chart data for top 8 API keys. Each entry has "date" (timestamp) plus key descriptions as keys.
                  topKeyNames:
                    type: array
                    items:
                      type: string
                    description: Descriptions of the top 8 API keys by usage (for chart legends)
                required:
                - lookback
                - byDate
                - byModel
                - byModelDaily
                - topModels
                - byKey
                - byKeyDaily
                - topKeyNames
                additionalProperties: false
                description: Aggregated usage analytics response with breakdowns by date, model, and API key
                example:
                  lookback: 7d
                  byDate:
                  - date: 2024-01-15
                    USD: 0.5
                    DIEM: 10.25
                  - date: 2024-01-14
                    USD: 0.3
                    DIEM: 8.75
                  byModel:
                  - modelName: GLM 5.1
                    unitType: tokens
                    modelType: LLM
                    totalUsd: 0.4
                    totalDiem: 12.5
                    totalUnits: 50000
                    breakdown:
                    - type: Output
                      usd: 0.3
                      diem: 10
                      units: 35000
                    - type: Input
                      usd: 0.1
                      diem: 2.5
                      units: 15000
                  byModelDaily:
                  - date: 1705276800000
                    GLM 5.1: 5.5
                    Kimi K2.6: 3.2
                  topModels:
                  - GLM 5.1
                  - Kimi K2.6
                  byKey:
                  - apiKeyId: key_abc123
                    description: Production Key
                    totalUsd: 0.8
                    totalDiem: 15
                    totalUnits: 75000
                  - apiKeyId: null
                    description: Web App
                    totalUsd: 0
                    totalDiem: 4
                    totalUnits: 25000
                  byKeyDaily:
                  - date: 1705276800000
                    Production Key: 8.5
                    Web App: 2
                  topKeyNames:
                  - Production Key
                  - Web App
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          $ref: '#/components/responses/ApiKeyIpRestrictedError'
        '500':
          description: Inference processing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '504':
          description: Query timed out - try reducing the lookback period
          content:
            application/json:
              schema:
                properties:
                  error:
                    description: Error message indicating query timeout
                    type: string
                type: object
    servers:
    - url: https://api.venice.ai/api/v1
  /billing/usage-history:
    get:
      description: Get billing usage data for the authenticated user as a cursor-paginated walk in ascending timestamp order. The first request takes filter parameters; while more entries remain, each response carries a nextCursor token that fetches the next page. A continuation request sends the cursor and nothing else — the filters travel inside the cursor, and filter parameters sent alongside one are rejected. A rejected cursor (expired, tampered with, or issued to another user) yields a 400 response; restart the walk from the first page. Page contents are stable while new usage is recorded, and no result totals are reported. Include text/csv in the Accept header to receive the page as a CSV export instead of JSON.
      operationId: getBillingUsageHistory
      summary: /api/v1/billing/usage-history
      tags:
      - Billing
      parameters:
      - schema:
          type: string
          enum:
          - USD
          - DIEM
          - BUNDLED_CREDITS
          - EARNED_CREDITS
          description: Filter by consumable currency
          example: USD
        required: false
        name: currency
        in: query
      - schema:
          type: string
          maxLength: 512
          pattern: ^[A-Za-z0-9_-]+$
          description: Opaque continuation token from a previous response's nextCursor. The cursor carries the filters of the walk it continues, so no filter parameters may be sent alongside it.
          example: AZq3fK9tXhIVDm2j4vN8cQwYt1sB6uEoLxRgPzKaJdHfM5nC7yW0K3w
        required: false
        name: cursor
        in: query
      - schema:
          type: string
          maxLength: 40
          format: date-time
          description: Exclusive upper bound on entry timestamps (ISO 8601 UTC, "Z" suffix). Must be later than startTimestamp; consecutive windows sharing a boundary walk the history without gaps or overlaps. Carried forward by the cursor.
          example: 2026-07-01 00:00:00+00:00
        required: false
        name: endTimestamp
        in: query
      - schema:
          type: integer
          minimum: 10
          maximum: 1000
          default: 1000
          description: Number of entries per page. Carried forward by the cursor.
          example: 1000
        required: false
        name: pageSize
        in: query
      - schema:
          type: string
          maxLength: 40
          format: date-time
          description: 'Inclusive lower bound on entry timestamps (ISO 8601 UTC, "Z" suffix). First page only: a continuation resumes from the cursor position instead.'
          example: 2026-06-01 00:00:00+00:00
        required: false
        name: startTimestamp
        in: query
      responses:
        '200':
          description: Successful response
          headers:
            Content-Disposition:
              schema:
                description: 'CSV responses only: attachment whose filename is stamped with the export time (UTC, compact ISO 8601), so each page of a paged walk downloads under a unique name and filenames sort in walk order'
                example: attachment; filename=billing-usage-history-20260708T091530123Z.csv
                pattern: ^attachment; filename=billing-usage-history-\d{8}T\d{9}Z\.csv$
                type: string
            x-next-cursor:
              schema:
                description: 'CSV responses only: continuation token for the next page, sent as the cursor query parameter. Absent when this is the last page. JSON responses carry the token in the nextCursor body field instead.'
                example: AZq3fK9tXhIVDm2j4vN8cQwYt1sB6uEoLxRgPzKaJdHfM5nC7yW0K3w
                maxLength: 512
                minLength: 1
                pattern: ^[A-Za-z0-9_-]+$
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: number
                          description: The total amount charged for the billing usage entry
                        apiKeyId:
                          type:
                          - string
                          - 'null'
                          format: uuid
                          description: 'ID of the API key the entry was charged to, matching the id returned by /api_keys. null when the entry was not charged to an API key: usage from the Venice web app, and non-usage entries such as credit purchases, grants and balance transfers.'
                          example: e28e82dc-9df2-4b47-b726-d0a222ef2ab5
                        currency:
                          type: string
                          enum:
                          - USD
                          - DIEM
                          - BUNDLED_CREDITS
                          - EARNED_CREDITS
                          description: The currency charged for the billing usage entry
                          example: USD
                        inferenceDetails:
                          type:
                          - object
                          - 'null'
                          properties:
                            completionTokens:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Number of tokens used in the completion. null for non-LLM usage or when the count was not recorded.
                            inferenceExecutionTime:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Time taken for inference execution in milliseconds. null when the timing was not recorded.
                            promptTokens:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Number of tokens requested in the prompt. null for non-LLM usage or when the count was not recorded.
                            requestId:
                              type: string
                              description: Unique identifier for the inference request
                          required:
                          - completionTokens
                          - inferenceExecutionTime
                          - promptTokens
                          - requestId
                          additionalProperties: false
                          description: Details about the related inference request, if applicable
                        notes:
                          type: string
                          description: Notes about the billing usage entry
                        pricePerUnitUsd:
                          type: number
                          description: The price per unit in USD
                        sku:
                          type: string
                          description: The product associated with the billing usage entry
                        timestamp:
                          type: string
                          maxLength: 40
                          format: date-time
                          description: The timestamp the billing usage entry was created (ISO 8601)
                          example: 2026-06-15 19:05:10.504000+00:00
                        units:
                          type: number
                          description: The number of units consumed
                      required:
                      - amount
                      - apiKeyId
                      - currency
                      - inferenceDetails
                      - notes
                      - pricePerUnitUsd
                      - sku
                      - timestamp
                      - units
                      additionalProperties: false
                    maxItems: 1000
                    description: Usage entries in ascending timestamp order
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    maxLength: 512
                    pattern: ^[A-Za-z0-9_-]+$
                    description: Continuation token for the next page, to be sent as the cursor query parameter. null means this is the last page.
                required:
                - data
                - nextCursor
                additionalProperties: false
                description: The response schema for the billing usage history endpoint
                example:
                  data:
                  - amount: -0.1
                    apiKeyId: e28e82dc-9df2-4b47-b726-d0a222ef2ab5
                    currency: DIEM
                    inferenceDetails: null
                    notes: API Inference
                    pricePerUnitUsd: 0.1
                    sku: grok-imagine-image-image-unit
                    timestamp: 2026-06-14 19:52:45.087000+00:00
                    units: 1
                  - amount: -0.06356
                    apiKeyId: e28e82dc-9df2-4b47-b726-d0a222ef2ab5
                    currency: DIEM
                    inferenceDetails:
                      completionTokens: 227
                      inferenceExecutionTime: 2964
                      promptTokens: 339
                      requestId: chatcmpl-4007fd29f42b7d3c4107f4345e8d174a
                    notes: API Inference
                    pricePerUnitUsd: 2.8
                    sku: zai-org-glm-5-1-llm-output-mtoken
                    timestamp: 2026-06-15 19:05:10.504000+00:00
                    units: 0.000227
                  nextCursor: AZq3fK9tXhIVDm2j4vN8cQwYt1sB6uEoLxRgPzKaJdHfM5nC7yW0K3w
            text/csv:
              schema:
                description: CSV formatted billing usage history data
                type: string
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          $ref: '#/components/responses/ApiKeyIpRestrictedError'
        '500':
          description: An unknown error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
components:
  schemas:
    DetailedError:
      type: object
      properties:
        details:
          type: object
          properties: {}
          description: Details about the incorrect input
          example:
            _errors: []
            field:
              _errors:
              - Field is required
        error:
          type: string
          description: A description of the error
      required:
      - error
    StandardError:
      type: object
      properties:
        error:
          type: string
          description: A description of the error
      required:
      - error
    ApiKeyIpRestrictedError:
      type: object
      properties:
        error:
          type: string
          enum:
          - This API key is restricted to configured IP addresses, and this request's source IP is not allowed
          description: A description of the error
          example: This API key is restricted to configured IP addresses, and this request's source IP is not allowed
      required:
      - error
  responses:
    ApiKeyIpRestrictedError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiKeyIpRestrictedError'
      description: This API key is restricted to configured IP addresses, and this request's source IP is not allowed
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    siwx:
      description: 'Wallet-based authentication using the x402 protocol (Sign-In-With-X). Supports EVM SIWE signatures on Base and Ed25519 signatures on Solana mainnet.


        **Header format:** Base64-encoded JSON object with the following fields:

        - `address` — EVM or Solana wallet address

        - `message` — Signed SIWX message. EVM wallets use EIP-4361 SIWE; Solana wallets use the Solana SIWX message format.

        - `signature` — Signature of the message, signed by the wallet''s private key. EVM signatures are hex; Solana signatures may be base58 or base64.

        - `timestamp` — Unix timestamp in milliseconds

        - `chainId` — Chain identity. Use `8453`, `"8453"`, or `"eip155:8453"` for Base; use `"solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"` for Solana.

        - `type` — Optional signature type. Use `"ed25519"` for Solana. Omitted means EVM/EIP-191 for backward compatibility.


        **EVM SIWE message fields:**

        - `domain`: `api.venice.ai`

        - `uri`: `https://api.venice.ai`

        - `version`: `"1"`

        - `chainId`: `8453`

        - `nonce`: Random 16-character hex string

        - `issuedAt` / `expirationTime`: ISO timestamps (recommended TTL: 10 minutes)

        - `statement`: `"Sign in to Venice API"`


        **Example (TypeScript):**

        ```

        import { Wallet } from ''ethers''

        import { SiweMessage } from ''siwe''


        const wallet = new Wallet(PRIVATE_KEY)

        const msg = new SiweMessage({ domain: ''api.venice.ai'', address: wallet.address, statement: ''Sign in to Venice API'', uri: ''https://api.venice.ai'', version: ''1'', chainId: 8453, nonce: crypto.randomUUID().replace(/-/g, '''').slice(0, 16), issuedAt: new Date().toISOString(), expirationTime: new Date(Date.now() + 600000).toISOString() })

        const signature = await wallet.signMessage(msg.prepareMessage())

        const header = btoa(JSON.stringify({ address: wallet.address, message: msg.prepareMessage(), signature, timestamp: Date.now(), chainId: 8453 }))

        // Set header: SIGN-IN-WITH-X: <header>

        ```


        **Solana message fields:** The signed message starts with `<domain> wants you to sign in with your Solana account:`, followed by the wallet address and the standard `URI`, `Version`, `Chain ID`, `Nonce`, `Issued At`, and optional `Expiration Time` fields. Use `type: "ed25519"` and `chainId: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"` in the encoded JSON payload.


        **SDK:** `npm install @venice-ai/x402-client` provides `VeniceClient` and `createAuthFetch` which handle this automatically.


        **Billing:** x402 users pay from a prepaid USDC credit balance. Top up via `POST /x402/top-up`. When balance is insufficient, endpoints return `402` with structured top-up instructions.'
      in: header
      name: SIGN-IN-WITH-X
      type: apiKey
externalDocs:
  description: Venice.ai API documentation
  url: https://docs.venice.ai
