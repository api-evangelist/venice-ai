openapi: 3.2.0
info:
  title: Venice Ai Preview API
  version: '20261012.214344'
  termsOfService: https://venice.ai/legal/tos
  x-guidance: 'Venice.ai is an OpenAI-compatible inference API supporting text, image, audio, and video generation.


    **Authentication options:**

    - API Key: Use Bearer token in Authorization header

    - x402 Wallet: Use USDC credits via EVM or Solana wallet (no account required)


    **For x402 wallet access:**

    1. POST /x402/top-up without headers to get payment requirements

    2. Choose one of the returned Base or Solana payment options and sign a USDC payment using the x402 SDK

    3. POST /x402/top-up with PAYMENT-SIGNATURE header to add credits

    4. Call any inference endpoint with SIGN-IN-WITH-X header


    **Pricing:** Prepaid credits consumed per request. Check /models for available models and their capabilities.'
  description: 'Operations tagged Preview across 2 of this provider''s published API definitions: venice-ai-swagger.yaml, venice-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.venice.ai/api/v1
security:
- BearerAuth: []
tags:
- name: Preview
paths:
  /characters:
    get:
      description: This is a preview API and may change. Returns a list of characters supported in the API, with filtering by search, tags, categories, model, and sort options.
      operationId: listCharacters
      summary: /api/v1/characters
      tags:
      - Preview
      parameters:
      - schema:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 20
          description: Filter by category names. Repeat the parameter for multiple values. Comma-separated values are also accepted.
          example:
          - roleplay
          - philosophy
        required: false
        name: categories
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Filter by adult content flag
          example: 'false'
        required: false
        name: isAdult
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Filter to only show characters using pro models
          example: 'false'
        required: false
        name: isPro
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Filter to only show web-enabled characters
          example: 'true'
        required: false
        name: isWebEnabled
        in: query
      - schema:
          type: integer
          maximum: 100
          default: 50
          description: 'Number of characters to return (max: 100)'
          example: 50
          exclusiveMinimum: 0
        required: false
        name: limit
        in: query
      - schema:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 20
          description: Filter by model ID(s). Repeat the parameter for multiple values. Comma-separated values are also accepted.
          example:
          - zai-org-glm-5-1
          - kimi-k2-6
        required: false
        name: modelId
        in: query
      - schema:
          type:
          - integer
          - 'null'
          minimum: 0
          default: 0
          description: Number of characters to skip for pagination
          example: 0
        required: false
        name: offset
        in: query
      - schema:
          type: string
          maxLength: 200
          description: Search characters by name, description, or tags. Hashtag search is supported.
          example: assistant
        required: false
        name: search
        in: query
      - schema:
          type: string
          enum:
          - featured
          - highestRating
          - highlyRated
          - highlyRatedAndRecent
          - imports
          - mostRecent
          - ratingCount
          description: Sort results using a supported character discovery mode
          example: imports
        required: false
        name: sortBy
        in: query
      - schema:
          type: string
          enum:
          - asc
          - desc
          description: Sort order applied to the selected sort mode. Defaults to descending when omitted.
          example: desc
        required: false
        name: sortOrder
        in: query
      - schema:
          type: array
          items:
            type: string
            maxLength: 100
          maxItems: 20
          description: Filter by tag names. Repeat the parameter for multiple values. Comma-separated values are also accepted.
          example:
          - helpful
          - productivity
        required: false
        name: tags
        in: query
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        adult:
                          type: boolean
                          description: Whether the character is considered adult content
                          example: false
                        author:
                          type: string
                          description: Short anonymized identifier derived from the character author
                          example: k3x9q
                        createdAt:
                          type: string
                          description: Date when the character was created
                          example: 2024-12-20 21:28:08.934000+00:00
                        description:
                          type:
                          - string
                          - 'null'
                          description: Description of the character
                          example: Alan Watts (6 January 1915 – 16 November 1973) was a British and American writer, speaker, and self-styled "philosophical entertainer", known for interpreting and popularizing Buddhist, Taoist, and Hindu philosophy for a Western audience.
                        featured:
                          type: boolean
                          description: Whether the character is featured in public discovery surfaces
                          example: false
                        id:
                          type: string
                          description: Unique ID of the character
                          example: 2f460055-7595-4640-9cb6-c442c4c869b0
                        name:
                          type: string
                          description: Name of the character
                          example: Alan Watts
                        shareUrl:
                          type:
                          - string
                          - 'null'
                          description: Share URL of the character
                          example: https://venice.ai/c/alan-watts
                        photoUrl:
                          type:
                          - string
                          - 'null'
                          description: URL of the character photo
                          example: https://outerface.venice.ai/api/characters/2f460055-7595-4640-9cb6-c442c4c869b0/photo
                        slug:
                          type: string
                          description: Slug of the character to be used in the completions API
                          example: alan-watts
                        stats:
                          type: object
                          properties:
                            averageRating:
                              type: number
                              description: Average rating for the character
                              example: 4.7
                            imports:
                              type: number
                              description: Number of imports for the character
                              example: 112
                            ratingCount:
                              type: number
                              description: Number of ratings for the character
                              example: 24
                            ratingSum:
                              type: number
                              description: Sum of all rating values for the character
                              example: 113
                            userRating:
                              type:
                              - number
                              - 'null'
                              description: The authenticated user rating for the character when available
                          required:
                          - averageRating
                          - imports
                          - ratingCount
                          - ratingSum
                          - userRating
                        tags:
                          type: array
                          items:
                            type: string
                          description: Tags associated with the character
                          example:
                          - AlanWatts
                          - Philosophy
                          - Buddhism
                          - Taoist
                          - Hindu
                        updatedAt:
                          type: string
                          description: Date when the character was last updated
                          example: 2025-02-09 03:23:53.708000+00:00
                        webEnabled:
                          type: boolean
                          description: Whether the character is enabled for web use
                          example: true
                        modelId:
                          type: string
                          description: API model ID for the character
                          example: venice-uncensored-1-2
                      required:
                      - adult
                      - author
                      - createdAt
                      - description
                      - featured
                      - id
                      - name
                      - shareUrl
                      - photoUrl
                      - slug
                      - stats
                      - tags
                      - updatedAt
                      - webEnabled
                      - modelId
                  object:
                    type: string
                    enum:
                    - list
                required:
                - data
                - object
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          $ref: '#/components/responses/ApiKeyIpRestrictedError'
        '500':
          description: An unknown error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
  /characters/{slug}:
