  /characters/{slug}/reviews:
    get:
      description: This is a preview API and may change. Returns paginated public reviews for a single character.
      operationId: getCharacterReviews
      summary: /api/v1/characters/{slug}/reviews
      tags:
      - Preview
      parameters:
      - schema:
          type: string
          description: Slug of the character whose reviews should be retrieved
          example: alan-watts
        required: true
        name: slug
        in: path
      - schema:
          type: integer
          default: 1
          description: Page number for pagination
          example: 1
          exclusiveMinimum: 0
        required: false
        name: page
        in: query
      - schema:
          type: integer
          maximum: 100
          default: 20
          description: 'Number of reviews to return per page (max: 100)'
          example: 20
          exclusiveMinimum: 0
        required: false
        name: pageSize
        in: query
      responses:
        '200':
          description: OK
          headers:
            x-pagination-limit:
              schema:
                description: Number of reviews returned per page
                example: 20
                type: number
            x-pagination-page:
              schema:
                description: Current page number
                example: 1
                type: number
            x-pagination-total:
              schema:
                description: Total number of visible reviews
                example: 87
                type: number
            x-pagination-total-pages:
              schema:
                description: Total number of result pages
                example: 5
                type: number
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        characterId:
                          type: string
                          description: Unique ID of the reviewed character
                          example: 2f460055-7595-4640-9cb6-c442c4c869b0
                        createdAt:
                          type: string
                          description: Date when the review was created
                          example: 2025-02-09 03:23:53.708000+00:00
                        id:
                          type: string
                          description: Unique ID of the review
                          example: 1e38fb78-043f-4ce2-b3bc-966089c25467
                        isOwner:
                          type: boolean
                          description: Whether the authenticated user authored this review
                          example: false
                        locale:
                          type:
                          - string
                          - 'null'
                          description: Locale reported by the reviewer when available
                          example: en
                        message:
                          type:
                          - string
                          - 'null'
                          description: Optional written review message
                          example: Thoughtful, grounded, and surprisingly practical.
                        rating:
                          type: integer
                          minimum: 1
                          maximum: 5
                          description: Star rating for the character
                          example: 5
                        userAvatarUrl:
                          type:
                          - string
                          - 'null'
                          description: Avatar URL for the reviewer when available
                          example: https://cdn.venice.ai/avatar.png
                        username:
                          type: string
                          description: Display name chosen by the reviewer
                          example: product_user_42
                      required:
                      - characterId
                      - createdAt
                      - id
                      - isOwner
                      - locale
                      - message
                      - rating
                      - userAvatarUrl
                      - username
                  object:
                    type: string
                    enum:
                    - list
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                        description: Current page number
                        example: 1
                        exclusiveMinimum: 0
                      pageSize:
                        type: integer
                        description: Number of reviews requested per page
                        example: 20
                        exclusiveMinimum: 0
                      total:
                        type: integer
                        minimum: 0
                        description: Total number of visible reviews for the character
                        example: 87
                      totalPages:
                        type: integer
                        minimum: 0
                        description: Total number of pages available
                        example: 5
                    required:
                    - page
                    - pageSize
                    - total
                    - totalPages
                  summary:
                    type: object
                    properties:
                      averageRating:
                        type: number
                        description: Average rating for the character
                        example: 4.7
                      totalReviews:
                        type: integer
                        minimum: 0
                        description: Total number of reviews included in the character stats summary
                        example: 87
                    required:
                    - averageRating
                    - totalReviews
                required:
                - data
                - object
                - pagination
                - summary
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedError'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '403':
          $ref: '#/components/responses/ApiKeyIpRestrictedError'
        '404':
          description: Character not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          description: An unknown error occurred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
