      operationId: getCharacterBySlug
      parameters:
      - description: The slug of the character to retrieve
        in: path
        name: slug
        required: true
        schema:
          example: alan-watts
          type: string
      summary: /api/v1/characters/{slug}
      tags:
      - Preview
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      adult:
                        type: boolean
                        description: Whether the character is considered adult content
                        example: false
                      author:
                        type: string
                        description: Short anonymized identifier derived from the character author
                        example: k3x9q
                      createdAt:
                        type: string
                        description: Date when the character was created
                        example: 2024-12-20 21:28:08.934000+00:00
                      description:
                        type:
                        - string
                        - 'null'
                        description: Description of the character
                        example: Alan Watts (6 January 1915 – 16 November 1973) was a British and American writer, speaker, and self-styled "philosophical entertainer", known for interpreting and popularizing Buddhist, Taoist, and Hindu philosophy for a Western audience.
                      featured:
                        type: boolean
