          enum:
          - low
          - medium
          - high
          - auto
          description: Controls the verbosity of the text response. Currently supported values are `low`, `medium`, and `high`.
          example: low
        text:
          type: object
          properties:
            verbosity:
              type: string
              enum:
              - low
              - medium
              - high
              - auto
              description: Controls the verbosity of the text response.
              example: low
