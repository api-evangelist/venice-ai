openapi: 3.2.0
info:
  title: Venice Ai Chat API
  version: '20261012.214344'
  termsOfService: https://venice.ai/legal/tos
  x-guidance: 'Venice.ai is an OpenAI-compatible inference API supporting text, image, audio, and video generation.


    **Authentication options:**

    - API Key: Use Bearer token in Authorization header

    - x402 Wallet: Use USDC credits via EVM or Solana wallet (no account required)


    **For x402 wallet access:**

    1. POST /x402/top-up without headers to get payment requirements

    2. Choose one of the returned Base or Solana payment options and sign a USDC payment using the x402 SDK

    3. POST /x402/top-up with PAYMENT-SIGNATURE header to add credits

    4. Call any inference endpoint with SIGN-IN-WITH-X header


    **Pricing:** Prepaid credits consumed per request. Check /models for available models and their capabilities.'
  description: 'Operations tagged Chat across 2 of this provider''s published API definitions: venice-ai-swagger.yaml, venice-ai-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.venice.ai/api/v1
security:
- BearerAuth: []
tags:
- description: Given a list of messages comprising a conversation, the model will return a response. Supports multimodal inputs including text, images, audio (input_audio), and video (video_url) for compatible models.
  name: Chat Completions
paths:
  /chat/completions:
    post:
      description: 'Run text inference based on the supplied parameters. Supports multimodal inputs including text, images (image_url), audio (input_audio), video (video_url), and files (file) for compatible models. File inputs (PDF, DOCX, PPTX, XLSX, TXT, etc.) are automatically extracted to text before being sent to the model. Long running requests should use the streaming API by setting stream=true in your request.


        **Authentication:** This endpoint accepts either a Bearer API key or a `SIGN-IN-WITH-X` header for x402 wallet-based authentication. The legacy `X-Sign-In-With-X` header is also accepted during migration. When using x402, a `402 Payment Required` response indicates insufficient balance and includes top-up instructions.'
      operationId: createChatCompletion
      parameters:
      - description: Supported compression encodings (gzip, br). Only applied when stream is false.
        in: header
        name: Accept-Encoding
        required: false
        schema:
          example: gzip, br
          type: string
      security:
      - BearerAuth: []
      - siwx: []
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: '0.001'
          max: '10.00'
        protocols:
        - x402: {}
      summary: /api/v1/chat/completions
      tags:
      - Chat Completions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: OK
          headers:
            X-Balance-Remaining:
              description: Remaining x402 credit balance in USD after this request (only present for x402 auth).
              required: false
              schema:
                type: string
                example: '4.230000'
            Content-Encoding:
              description: The encoding used to compress the response
              schema:
                enum:
                - gzip
                - br
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        finish_reason:
                          type: string
                          enum:
                          - stop
                          - length
                          - tool_calls
                          - content_filter
                          description: The reason the completion finished.
                          example: stop
                        index:
                          type: integer
                          description: The index of the choice in the list.
                          example: 0
                        logprobs:
                          type:
                          - object
                          - 'null'
                          properties:
                            bytes:
                              type: array
                              items:
                                type: number
                              description: Raw bytes of the token
                              example:
                              - 104
                              - 101
                              - 108
                              - 108
                              - 111
                            logprob:
                              type: number
                              description: The log probability of this token
                              example: -0.34
                            token:
                              type: string
                              description: The token string
                              example: hello
                            top_logprobs:
                              type: array
                              items:
                                type: object
                                properties:
                                  bytes:
                                    type: array
                                    items:
                                      type: number
                                  logprob:
                                    type: number
                                  token:
                                    type: string
                                required:
                                - logprob
                                - token
                              description: Top tokens considered with their log probabilities
                          required:
                          - logprob
                          - token
                        message:
                          anyOf:
                          - type: object
                            properties:
                              content:
                                anyOf:
                                - type: string
                                  title: String
                                - type: array
                                  items:
                                    type: object
                                    properties:
                                      cache_control:
                                        type: object
                                        properties:
                                          ttl:
                                            type: string
                                            description: Optional TTL for extended cache duration. Beta feature requiring special header.
                                            example: 1h
                                          type:
                                            type: string
                                            enum:
                                            - ephemeral
                                            description: The type of cache control. Currently only "ephemeral" is supported.
                                            example: ephemeral
                                        required:
                                        - type
                                        description: Optional cache control for prompt caching on supported providers.
                                        example:
                                          type: ephemeral
                                        title: Cache Control
                                      text:
                                        type: string
                                        minLength: 1
                                        description: The prompt text of the message. Must be at-least one character in length
                                        example: Why is the sky blue?
                                        title: Text Content Object
                                      type:
                                        type: string
                                        enum:
                                        - text
                                        title: Text Content String
                                    required:
                                    - text
                                    - type
                                    description: Text message type. Supports optional cache_control for prompt caching on supported providers.
                                    example:
                                      text: Why is the sky blue?
                                      type: text
                                    title: text
                                  title: Objects
                                - title: 'null'
                              name:
                                type:
                                - string
                                - 'null'
                              reasoning_content:
                                type:
                                - string
                                - 'null'
                              reasoning_details:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    data:
                                      type: string
                                    format:
                                      type: string
                                    id:
                                      type: string
                                    index:
                                      type: number
                                    text:
                                      type: string
                                    type:
                                      type: string
                                  required:
                                  - type
                                description: Reasoning details returned by certain reasoning models that support this feature (e.g., Gemini 3 Pro). Not all reasoning models return this field. For multi-turn conversations with tool calls on supported models, pass back the reasoning_details exactly as received to preserve thought signatures.
                              role:
                                type: string
                                enum:
                                - assistant
                              thought_signature:
                                type:
                                - string
                                - 'null'
                                description: Gemini thought signature returned by native GCP transport. For multi-turn conversations (especially with tool calls), pass it back exactly as received to preserve thought signatures.
                              tool_calls:
                                type:
                                - array
                                - 'null'
                                items: {}
                            required:
                            - role
                            description: The assistant message contains the response from the LLM. Must have either content or tool_calls.
                            title: Assistant Message
                          - type: object
                            properties:
                              content:
                                type: string
                              name:
                                type:
                                - string
                                - 'null'
                              reasoning_content:
                                type:
                                - string
                                - 'null'
                              role:
                                type: string
                                enum:
                                - tool
                              tool_call_id:
                                type: string
                              tool_calls:
                                type:
                                - array
                                - 'null'
                                items: {}
                            required:
                            - content
                            - role
                            - tool_call_id
                            description: The tool message is a special message that is used to call a tool. It is not part of the conversation and is not visible to the user.
                            title: Tool Message
                        stop_reason:
                          type:
                          - string
                          - 'null'
                          enum:
                          - stop
                          - length
                          description: The reason the completion stopped.
                          example: stop
                      required:
                      - finish_reason
                      - index
                      - logprobs
                      - message
                    description: A list of chat completion choices. Can be more than one if n is greater than 1. Certain models may not return this field under certain conditions.
                    example:
                    - finish_reason: stop
                      index: 0
                      logprobs: null
                      message:
                        content: The sky appears blue because of the way Earth's atmosphere scatters sunlight. When sunlight reaches Earth's atmosphere, it is made up of various colors of the spectrum, but blue light waves are shorter and scatter more easily when they hit the gases and particles in the atmosphere. This scattering occurs in all directions, but from our perspective on the ground, it appears as a blue hue that dominates the sky's color. This phenomenon is known as Rayleigh scattering. During sunrise and sunset, the sunlight has to travel further through the atmosphere, which allows more time for the blue light to scatter away from our direct line of sight, leaving the longer wavelengths, such as red, yellow, and orange, to dominate the sky's color.
                        reasoning_content: null
                        role: assistant
                        tool_calls: []
                      stop_reason: null
                  created:
                    type: integer
                    description: The time at which the request was created.
                    example: 1677858240
                  cost:
                    type: object
                    properties:
                      diem:
                        type: number
                        minimum: 0
                        description: The DIEM-denominated portion of the request cost.
                        example: 0
                      usd:
                        type: number
                        minimum: 0
                        description: The USD-denominated portion of the request cost. Bundled credits are included as USD-equivalent cost.
                        example: 0.00042
                    required:
                    - diem
                    - usd
                    description: The request cost split by billing currency.
                  id:
                    type: string
                    description: The ID of the request.
                    example: chatcmpl-abc123
                  model:
                    type: string
                    description: The model id used for the request.
                    example: zai-org-glm-5-1
                  object:
                    type: string
                    enum:
                    - chat.completion
                    description: The type of the object returned.
                    example: chat.completion
                  prompt_logprobs:
                    anyOf:
                    - title: 'null'
                    - type: object
                      additionalProperties: {}
                    - title: 'null'
                    description: Log probability information for the prompt.
                  usage:
                    type: object
                    properties:
                      completion_tokens:
                        type: integer
                        description: The number of tokens in the completion.
                        example: 20
                      completion_tokens_details:
                        type:
                        - object
                        - 'null'
                        properties:
                          reasoning_tokens:
                            type: integer
                            description: Number of completion tokens consumed by reasoning/thinking output when the upstream model reports it.
                            example: 32
                        description: Breakdown of completion tokens for providers that expose reasoning token accounting.
                      prompt_tokens:
                        type: integer
                        description: The number of tokens in the prompt.
                        example: 10
                      prompt_tokens_details:
                        type:
                        - object
                        - 'null'
                        properties:
                          cached_tokens:
                            type: integer
                            description: Number of prompt tokens that were served from cache (cache read) which may result in a discounted rate.
                            example: 128
                          cache_creation_input_tokens:
                            type: integer
                            description: Number of prompt tokens that were written to cache (cache write). For some providers like Anthropic, this may be charged at a premium rate.
                            example: 64
                        description: Breakdown of prompt tokens. Includes cached_tokens (cache read) and cache_creation_input_tokens (cache write) for models that support context caching.
                      total_tokens:
                        type: integer
                        description: The total number of tokens used in the request.
                        example: 30
                    required:
                    - completion_tokens
                    - prompt_tokens
                    - total_tokens
                  venice_parameters:
                    type: object
                    properties:
                      enable_e2ee:
                        type: boolean
                        description: Did the request enable end-to-end encryption? Only applicable to E2EE-capable models.
                        example: true
                      enable_web_search:
                        type: string
                        enum:
                        - auto
                        - 'off'
                        - 'on'
                        description: Did the request enable web search?
                        example: auto
                      enable_web_citations:
                        type: boolean
                        description: Did the request enable web citations?
                        example: true
                      enable_web_scraping:
                        type: boolean
                        description: Did the request enable web scraping of URLs via Firecrawl?
                        example: false
                      include_venice_system_prompt:
                        type: boolean
                        description: Did the request include the Venice system prompt?
                        example: true
                      include_search_results_in_stream:
                        type: boolean
                        description: Did the request include search results in the stream?
                        example: false
                      return_search_results_as_documents:
                        type: boolean
                        description: Did the request also return search results as a tool-call documents block?
                        example: true
                      character_slug:
                        type: string
                        description: The character slug of a public Venice character.
                        example: venice
                      strip_thinking_response:
                        type: boolean
                        description: Did the request strip thinking response?
                        example: true
                      disable_thinking:
                        type: boolean
                        description: Did the request disable thinking?
                        example: true
                      web_search_citations:
                        type: array
                        items:
                          type: object
                          properties:
                            content:
                              type: string
                            date:
                              type: string
                            title:
                              type: string
                            url:
                              type: string
                          required:
                          - title
                          - url
                        description: Citations from web search results.
                        example:
                        - content: 'What&#x27;s the scientific reason behind Earth&#x27;s sky appearing blue to the human eye? And what&#x27;s the real colour of the sky?


                            Save 30% on the shop price when you subscribe to BBC Sky at Night Magazine today!


                            In this article we''ll look at the science behind why the sky is blue, or at least why it appears blue to our eyes.


                            A beautiful blue sky is the sign of a pleasant day ahead. But what makes the sky appear blue?


                            So, the sky appears blue because the molecules of nitrogen and oxygen in the atmosphere scatter light in short wavelengths towards the blue end of the visible spectrum.'
                          date: 2024-08-13 13:45:16
                          title: Why is the sky blue? | BBC Sky at Night Magazine
                          url: https://www.skyatnightmagazine.com/space-science/why-is-the-sky-blue
                        - content: 'It was around 1870 when the British physicist John William Strutt, better known as Lord Rayleigh, first found an explanation for why the sky is blue: Blue light from the Sun is scattered the most when it passes through the atmosphere.


                            Published: January 20, 2025 8:34am EST · Daniel Freedman, University of Wisconsin-Stout · Daniel Freedman · Dean of the College of Science, Technology, Engineering, Mathematics & Management, University of Wisconsin-Stout ·


                            The answer has to do with molecules.


                            It was around 1870 when the British physicist John William Strutt, better known as Lord Rayleigh, first found an explanation for why the sky is blue: Blue light from the Sun is scattered the most when it passes through the atmosphere.


                            When the Sun is near the horizon, its light passes through a lot more of the atmosphere to reach the Earth’s surface than when it is directly overhead. The blue and green light is scattered so well that you can hardly see it. The sky is colored, instead, with red and orange light.'
                          date: 2025-04-16 16:55:11
                          title: Why is the sky blue?
                          url: https://theconversation.com/why-is-the-sky-blue-246393
                    required:
                    - enable_e2ee
                    - enable_web_search
                    - enable_web_citations
                    - enable_web_scraping
                    - include_venice_system_prompt
                    - include_search_results_in_stream
                    - return_search_results_as_documents
                    - strip_thinking_response
                    - disable_thinking
                    description: Unique parameters to Venice's API implementation.
                required:
                - created
                - id
                - model
                - object
                - usage
                example:
                  choices:
                  - finish_reason: stop
                    index: 0
                    logprobs: null
                    message:
                      content: The sky appears blue because of the way Earth's atmosphere scatters sunlight. When sunlight reaches Earth's atmosphere, it is made up of various colors of the spectrum, but blue light waves are shorter and scatter more easily when they hit the gases and particles in the atmosphere. This scattering occurs in all directions, but from our perspective on the ground, it appears as a blue hue that dominates the sky's color. This phenomenon is known as Rayleigh scattering. During sunrise and sunset, the sunlight has to travel further through the atmosphere, which allows more time for the blue light to scatter away from our direct line of sight, leaving the longer wavelengths, such as red, yellow, and orange, to dominate the sky's color.
                      reasoning_content: null
                      role: assistant
                      tool_calls: []
                    stop_reason: null
                  created: 1739928524
                  cost:
                    diem: 0
                    usd: 0.00042
                  id: chatcmpl-a81fbc2d81a7a083bb83ccf9f44c6e5e
                  model: zai-org-glm-5-1
                  object: chat.completion
                  prompt_logprobs: null
                  usage:
                    completion_tokens: 146
                    completion_tokens_details: null
                    prompt_tokens: 612
                    prompt_tokens_details: null
                    total_tokens: 758
                  venice_parameters:
                    enable_e2ee: true
                    include_venice_system_prompt: true
                    include_search_results_in_stream: false
                    return_search_results_as_documents: false
                    web_search_citations: []
                    enable_web_search: auto
                    enable_web_scraping: false
                    enable_web_citations: true
                    strip_thinking_response: true
                    disable_thinking: true
                    character_slug: venice
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedError'
        '401':
          description: '- Authentication failed

            - This model is only available to Pro users'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '402':
          description: 'Payment or balance required. Response varies by authentication state:


            **API Key users:** Standard error response with `INSUFFICIENT_BALANCE` code. Top up your Venice balance at venice.ai.


            **Unauthenticated x402 discovery:** Structured x402 response with `x402Version`, `resource`, `accepts`, and `extensions["sign-in-with-x"]`. The `accepts` array advertises Base and Solana payment requirements.


            **Authenticated x402 wallet users with insufficient credit:** Structured response with `PAYMENT_REQUIRED` code containing:

            - `topUpInstructions`: Step-by-step guide to top up via x402 protocol

            - `supportedTokens` / `supportedChains`: Accepted payment methods

            - `siwxChallenge`: Fresh Sign-In-With-X challenge metadata


            The `PAYMENT-REQUIRED` header also contains a base64-encoded x402 protocol object with the payment requirements for programmatic discovery.'
          headers:
            PAYMENT-REQUIRED:
              description: Base64-encoded JSON with x402 payment requirements. Present on x402 middleware 402 responses. Decode to choose and sign one accepted payment requirement programmatically.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/StandardError'
                - $ref: '#/components/schemas/X402InferencePaymentRequired'
        '403':
          $ref: '#/components/responses/ApiKeyIpRestrictedError'
        '415':
          description: Invalid request content-type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '500':
          description: Inference processing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '503':
          description: The model is at capacity. Please try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
        '504':
          description: The request took too long to complete and was timed-out. For long-running inference requests, use the streaming API by setting stream=true in your request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
    servers:
    - url: https://api.venice.ai/api/v1
components:
  schemas:
    DetailedError:
      type: object
      properties:
        details:
          type: object
          properties: {}
          description: Details about the incorrect input
          example:
            _errors: []
            field:
              _errors:
              - Field is required
        error:
          type: string
          description: A description of the error
      required:
      - error
    X402InferencePaymentRequired:
      anyOf:
      - type: object
        properties:
          x402Version:
            type: number
            description: x402 protocol version.
            example: 2
          error:
            type: string
            description: Human-readable payment requirement message.
            example: Payment required
          resource:
            type: object
            properties:
              url:
                type: string
                description: Protected resource URL.
                example: https://api.venice.ai/api/v1/chat/completions
              description:
                type: string
                description: Human-readable resource description.
                example: Venice API
              mimeType:
                type: string
                description: Resource MIME type.
                example: application/json
            required:
            - url
            - description
            - mimeType
            additionalProperties: false
          accepts:
            type: array
            items:
              type: object
              properties:
                scheme:
                  type: string
                  enum:
                  - exact
                  description: x402 payment scheme.
                  example: exact
                network:
                  type: string
                  description: Payment network for this requirement.
                  example: solana
                asset:
                  type: string
                  description: USDC token address or mint for the selected network.
                  example: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                amount:
                  type: string
                  description: Required payment amount in base units (USDC has 6 decimals).
                  example: '10000000'
                payTo:
                  type: string
                  description: Receiver wallet address for the selected network.
                  example: 8qUL23aSj7mDWdoLMXGHFvnVCT9wd7jXcysiekroADEL
                maxTimeoutSeconds:
                  type: number
                  description: Maximum time allowed for payment settlement.
                  example: 300
                extra:
                  type: object
                  properties: {}
                  description: Network-specific x402 metadata. Solana requirements include a feePayer.
                  example:
                    name: USD Coin
                    version: '2'
                    feePayer: BFK9TLC3edb13K6v4YyH3DwPb5DSUpkWvb7XnqCL9b4F
              required:
              - scheme
              - network
              - asset
              - amount
              - payTo
              - maxTimeoutSeconds
              - extra
              additionalProperties: false
            description: Protocol payment requirements. Clients should choose one entry, such as Base or Solana, and sign exactly that requirement.
          extensions:
            type: object
            properties: {}
            description: Protocol extensions. Inference 402 responses include `sign-in-with-x` with a SIWX challenge for wallet-credit authentication.
          authOptions:
            type: object
            properties:
              apiKey:
                type: object
                properties:
                  header:
                    type: string
                    description: API key authentication header format.
                    example: 'Authorization: Bearer YOUR_API_KEY'
                  getKey:
                    type: string
                    description: Where to create or manage API keys.
                    example: https://venice.ai/settings/api
                  docs:
                    type: string
                    description: API key documentation URL.
                    example: https://docs.venice.ai/api-reference
                required:
                - header
                - getKey
                - docs
                additionalProperties: false
              x402Wallet:
                type: object
                properties:
                  header:
                    type: string
                    description: Header used for Sign-In-With-X wallet authentication.
                    example: SIGN-IN-WITH-X
                  legacyHeader:
                    type: string
                    description: Legacy Sign-In-With-X header accepted during migration.
                    example: X-Sign-In-With-X
                  topUp:
                    type: string
                    description: Endpoint used to discover and submit x402 top-up payments.
                    example: POST /api/v1/x402/top-up
                  docs:
                    type: string
                    description: x402 top-up API documentation URL.
                    example: https://docs.venice.ai/api-reference/endpoint/x402/top-up
                required:
                - header
                - legacyHeader
                - topUp
                - docs
                additionalProperties: false
            required:
            - apiKey
            - x402Wallet
            additionalProperties: false
        required:
        - x402Version
        - resource
        - accepts
        - authOptions
        additionalProperties: false
        description: Returned when an inference request has no API key or wallet authentication. The JSON body includes x402 discovery requirements and authentication options.
      - type: object
        properties:
          error:
            type: string
            enum:
            - Payment required
            description: Error message indicating payment is required.
          code:
            type: string
            enum:
            - PAYMENT_REQUIRED
            description: Machine-readable error code.
          reason:
            type: string
            enum:
            - insufficient_balance
            description: Reason the x402-authenticated request could not proceed.
          message:
            type: string
            description: Human-readable context about the payment requirement.
            example: Insufficient x402 balance
          currentBalanceUsd:
            type: number
            description: Current x402 credit balance for the wallet.
            example: 0.01
          minimumBalanceUsd:
            type: number
            description: Minimum x402 credit balance required before the request can run.
            example: 0.1
          description:
            type: string
            description: Protected resource description.
            example: Venice API
          suggestedTopUpUsd:
            type: number
            description: Suggested amount to top up in USD.
            example: 10
          minimumTopUpUsd:
            type: number
            description: Minimum allowed top-up amount in USD.
            example: 5
          supportedTokens:
            type: array
            items:
              type: string
            description: List of supported token symbols for payment.
            example:
            - USDC
          supportedChains:
            type: array
            items:
              type: string
            description: List of supported top-up rails.
            example:
            - base
            - solana
          topUpInstructions:
            type: object
            properties:
              step1:
                type: string
                description: 'First step: get payment requirements.'
                example: POST /api/v1/x402/top-up with no payment header to get payment requirements
              step2:
                type: string
                description: 'Second step: sign the payment.'
                example: Choose a payment option from accepts and sign a USDC transfer authorization using the x402 SDK (createPaymentHeader)
              step3:
                type: string
                description: 'Third step: submit the payment.'
                example: POST /api/v1/x402/top-up with the signed PAYMENT-SIGNATURE header
              receiverWallet:
                type: string
                description: Legacy Base receiver wallet address. Prefer the selected accepts entry from /x402/top-up for network-specific payTo values.
                example: <RECEIVER_WALLET_ADDRESS>
