          headers:
            X-Balance-Remaining:
              description: Remaining x402 credit balance in USD after this request (only present for x402 auth).
              required: false
              schema:
                type: string
                example: '4.230000'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - PROCESSING
                    description: The conversion is still running. Poll again.
                    example: PROCESSING
                  average_execution_time:
                    type: number
                    description: Recent average end-to-end time for this model in milliseconds. Use it to pace polling.
                    example: 10000
                  execution_duration:
                    type: number
                    description: Milliseconds elapsed since the conversion was queued.
                    example: 4200
                required:
                - status
                - average_execution_time
                - execution_duration
            audio/mpeg:
              schema:
                type: string
                format: binary
