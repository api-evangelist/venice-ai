      security:
      - BearerAuth: []
      - siwx: []
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: '0.001'
          max: '10.00'
        protocols:
        - x402: {}
      summary: /api/v1/audio/voice-changer/queue
      tags:
      - Audio
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QueueVoiceChangerRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/QueueVoiceChangerRequest'
      responses:
        '200':
          description: Voice conversion queued successfully
          headers:
            X-Balance-Remaining:
              description: Remaining x402 credit balance in USD after this request (only present for x402 auth).
              required: false
              schema:
                type: string
                example: '4.230000'
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: string
                    description: The model that is running the conversion. Only voice-changer models are accepted on the `/api/v1/audio/voice-changer` endpoints.
                    example: elevenlabs-voice-changer
                  queue_id:
                    type: string
                    description: Pass this to /audio/voice-changer/retrieve to poll for the converted audio, and to /audio/voice-changer/complete when finished.
                    example: 0190f2c4-9c1e-7a3b-8f42-2c9d5e7a1b34
                  status:
                    type: string
                    enum:
                    - QUEUED
                    description: Always `QUEUED`. The provider has accepted the job.
                    example: QUEUED
                  duration_seconds:
                    type: number
                    description: Length of the source recording in seconds, measured server-side, and therefore the exact quantity billed for this request. Use it to reconcile against the estimate from /audio/voice-changer/quote.
                    example: 52
                required:
                - model
                - queue_id
                - status
                - duration_seconds
                additionalProperties: false
