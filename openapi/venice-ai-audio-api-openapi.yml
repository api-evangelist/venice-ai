      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueAudioRequest'
      responses:
        '200':
          description: Audio generation request queued successfully
          headers:
            X-Balance-Remaining:
              description: Remaining x402 credit balance in USD after this request (only present for x402 auth).
              required: false
              schema:
                type: string
                example: '4.230000'
          content:
            application/json:
              schema:
                type: object
                properties:
                  model:
                    type: string
                    description: The ID of the model used for audio generation. Voice-changer models are not supported on `/api/v1/audio/retrieve` or `/api/v1/audio/complete`; use the `/api/v1/audio/voice-changer` endpoints instead.
                    example: elevenlabs-music
                  queue_id:
                    type: string
                    description: The ID of the audio generation request. Use this to poll for status and retrieve the result.
                    example: 123e4567-e89b-12d3-a456-426614174000
                  status:
                    type: string
                    enum:
                    - QUEUED
                    description: The status of the audio generation request.
                    example: QUEUED
